<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة التوصيل والتركيب | الرفاعي</title><link rel="stylesheet" href="/public-sections.css"><style>.timeline{display:grid;gap:8px;margin-top:12px}.step{padding:10px;border-radius:10px;background:#f3f5f7;color:#68727d}.step.done{background:#eef8f3;color:#146b51;font-weight:800}.item{padding:15px;border:1px solid var(--line);border-radius:14px;margin:12px 0}.meta{line-height:1.9;color:#66717d}.staff{margin-top:12px;padding:12px;background:#f7f1e5;border-radius:12px}.empty{text-align:center;padding:28px;color:#68727d}</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>عمليات السودان</small></a><nav class="links"><a href="/account.html">حسابي</a><a href="/tracking.html">التتبع</a><a href="/">الرئيسية</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>استلام وتوصيل وتركيب الشحنة في السودان</h1><p>تابع موظفي الشركة من استلام الشحنة وحتى التسليم والتركيب في موقعك.</p></div></section><main class="main"><div class="wrap"><section class="panel"><div id="list"></div></section></div></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const flow=['awaiting_receipt','received','delivery_scheduled','out_for_delivery','delivered','installation_started','completed'];
async function api(path){const r=await fetch(path),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}function toast(t){$("toast").textContent=t;$("toast").style.display='block';setTimeout(()=>$("toast").style.display='none',2600)}
async function boot(){try{const me=await api('/api/me');if(!me.authenticated){location.href='/account.html';return}const d=await api('/api/my-sudan-fulfillment');render(d.operations,d.statuses)}catch(e){toast(e.message)}}
function render(rows,statuses){$("list").innerHTML=rows.length?rows.map(x=>{const st=x.status||'awaiting_receipt',idx=flow.indexOf(st);const steps=flow.map((s,i)=>`<div class="step ${idx>=i&&idx>=0?'done':''}">${idx>=i&&idx>=0?'✓':'○'} ${esc(statuses[s]||s)}</div>`).join('');return `<article class="item"><h2>${esc(x.order_no)}</h2><div class="meta">${esc(x.product)}<br>الوجهة: ${esc(x.sudan_city||x.order_city||'-')}${x.delivery_scheduled_at?`<br>موعد التوصيل: ${new Date(x.delivery_scheduled_at).toLocaleString('ar-SA')}`:''}</div>${x.employee_name?`<div class="staff"><b>موظف الرفاعي المسؤول:</b> ${esc(x.employee_name)}${x.employee_phone?`<br><a href="tel:${esc(x.employee_phone)}">${esc(x.employee_phone)}</a>`:''}</div>`:''}<div class="timeline">${steps}</div>${st==='issue'?'<p class="notice">توجد ملاحظة تحت المعالجة وسيتم التواصل معك.</p>':''}</article>`}).join(''):'<div class="empty">لا توجد شحنات في مرحلة الاستلام والتوصيل والتركيب حاليًا.</div>'}
boot();
</script></body></html>
