<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123047">
<title>تتبع الطلب | الرفاعي للشحن الدولي</title>
<link rel="stylesheet" href="/public-sections.css?v=3.8.6">
<style id="tracking-inline-fallback">
:root{--navy:#123047;--blue:#176b87;--gold:#b8892f;--cream:#f7f3ea;--white:#fff;--text:#17212b;--muted:#66727c;--line:#dfe5e8;--ok:#16834a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}a{text-decoration:none;color:inherit}.wrap{width:min(1080px,calc(100% - 28px));margin:auto}
.top{background:var(--navy);color:#fff}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:20px;font-weight:900}.brand small{display:block;color:#e7c577;font-size:11px;font-weight:700}.links{display:flex;gap:16px;align-items:center;font-size:13px}.links a{color:#fff}.links a:hover{color:#e7c577}
.hero{padding:48px 0 32px;background:linear-gradient(135deg,#123047,#176b87);color:#fff}.hero h1{font-size:clamp(32px,7vw,50px);margin:0 0 7px;line-height:1.25}.hero p{margin:0;color:#e6eff3;font-size:16px;max-width:700px}
.main{padding:28px 0 54px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 35px rgba(18,48,71,.08)}.track-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:stretch}.track-form input{width:100%;min-height:52px;padding:12px 15px;border:1px solid #cfd8dc;border-radius:12px;font:inherit;background:#fff;outline:none}.track-form input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,107,135,.12)}.btn{border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:#fff}.primary:active{transform:translateY(1px)}
.result{margin-top:18px}.notice{padding:14px 16px;border-radius:12px;background:#eef7fa;color:var(--blue)}.empty{padding:28px;text-align:center;color:var(--muted);background:#fafafa;border-radius:12px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:17px 8px;border:1px solid var(--line);border-radius:14px;text-align:center;color:var(--muted);background:#fff}.step i{display:block;width:34px;height:34px;line-height:34px;margin:0 auto 8px;border-radius:50%;background:#edf1f3;font-style:normal}.step.done{border-color:#9bd3b6;color:var(--ok);background:#f2fbf6}.step.done i{background:var(--ok);color:#fff}
.help-card{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}.whatsapp-link{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:9px 13px;background:#1fa855;color:#fff;font-weight:800}
footer{background:#0b2334;color:#dbe5ea;padding:24px 0}.footer-row{display:flex;justify-content:space-between;gap:20px;align-items:center}.footer-row a{color:#e7c577;font-weight:800}
@media(max-width:800px){.links{display:none}.steps{grid-template-columns:1fr 1fr}.hero{padding:38px 0 28px}.nav{min-height:62px}}
@media(max-width:560px){.wrap{width:min(100% - 22px,1080px)}.hero h1{font-size:36px}.hero p{font-size:15px}.main{padding-top:18px}.panel{padding:15px;border-radius:16px}.track-form{grid-template-columns:1fr}.track-form .btn{min-height:50px;width:100%}.steps{grid-template-columns:1fr}.help-card{align-items:stretch;flex-direction:column}.whatsapp-link{width:100%}.footer-row{display:block;text-align:center}.footer-row a{display:block;margin-top:6px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>متابعة مباشرة لحالة طلبك</small></a><nav class="links" aria-label="التنقل الرئيسي"><a href="/">الرئيسية</a><a href="/products.html">المنتجات</a><a href="/services.html">الخدمات</a><a href="/calculator.html">الحاسبة</a><a href="/how-it-works.html">كيف تعمل</a><a href="/cart.html">السلة</a><a href="/account.html">حسابي</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>أين وصل طلبك؟</h1><p>أدخل رقم الطلب كما وصلك، مثال: RIF-1234، لعرض آخر مرحلة مسجلة.</p></div></section>
<main class="main"><div class="wrap"><section class="panel" aria-labelledby="trackingTitle"><h2 id="trackingTitle" style="margin:0 0 14px;font-size:20px">تتبع حالة الطلب</h2><form id="form" class="track-form"><input id="orderNo" required autocomplete="off" inputmode="text" placeholder="رقم الطلب — مثال RIF-1234" aria-label="رقم الطلب"><button class="btn primary">عرض حالة الطلب</button></form><div id="result" class="result notice" aria-live="polite">ستظهر تفاصيل الطلب هنا.</div><div class="help-card"><span>هل تحتاج مساعدة في التتبع؟</span><a class="whatsapp-link" href="https://wa.me/966540407193?text=السلام%20عليكم،%20أحتاج%20مساعدة%20في%20تتبع%20طلبي" target="_blank" rel="noopener">تواصل عبر واتساب</a></div></section></div></main>
<footer><div class="wrap footer-row"><span>الرفاعي للشحن الدولي</span><a href="/">العودة للرئيسية</a></div></footer>
<script>
const labels=["تم استلام الطلب","تأكيد السعر والتوفر","الشراء والتجهيز","تم الشحن"];
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
form.addEventListener("submit",async e=>{e.preventDefault();const id=orderNo.value.trim();result.className="result notice";result.textContent="جاري التحقق…";try{const r=await fetch("/api/orders/"+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر جلب الطلب");const o=d.order;if(Number(o.status)===4){result.innerHTML=`<div class="empty">تم إلغاء الطلب <b>${safe(o.order_no)}</b></div>`;return}result.className="result";result.innerHTML=`<div class="steps">${labels.map((label,i)=>`<div class="step ${i<=Number(o.status)?"done":""}"><i>${i<=Number(o.status)?"✓":"○"}</i><b>${label}</b></div>`).join("")}</div><p class="notice">الطلب: <b>${safe(o.order_no)}</b> — ${safe(o.product)} — الوجهة: ${safe(o.city)}</p>`}catch(error){result.innerHTML=`<div class="empty">${safe(error.message)}</div>`}});
const query=new URLSearchParams(location.search).get("order");if(query){orderNo.value=query;form.requestSubmit()}
</script>
</body>
</html>
