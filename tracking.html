<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الطلب | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css"></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>متابعة مباشرة لحالة طلبك</small></a><nav class="links"><a href="/">الرئيسية</a><a href="/products.html">المنتجات</a><a href="/tracking.html">تتبع الطلب</a><a href="/partners.html">الشركاء</a><a href="/#accountArea">حسابي</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>أين وصل طلبك؟</h1><p>أدخل رقم الطلب كما وصلك، مثال: RIF-1234، لعرض آخر مرحلة مسجلة.</p></div></section>
<main class="main"><div class="wrap"><section class="panel"><form id="form" class="toolbar"><input id="orderNo" class="field" required autocomplete="off" placeholder="رقم الطلب"><button class="btn primary">عرض حالة الطلب</button></form><div id="result" class="result notice">ستظهر تفاصيل الطلب هنا.</div></section></div></main>
<footer><div class="wrap footer-row"><span>هل تحتاج مساعدة؟</span><a href="https://wa.me/966540407193?text=السلام%20عليكم،%20أحتاج%20مساعدة%20في%20تتبع%20طلبي" target="_blank" rel="noopener">تواصل عبر واتساب</a></div></footer>
<script>
const labels=["تم استلام الطلب","تأكيد السعر والتوفر","الشراء والتجهيز","تم الشحن"];
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
form.addEventListener("submit",async e=>{e.preventDefault();const id=orderNo.value.trim();result.className="result notice";result.textContent="جاري التحقق…";try{const r=await fetch("/api/orders/"+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر جلب الطلب");const o=d.order;if(Number(o.status)===4){result.innerHTML=`<div class="empty">تم إلغاء الطلب <b>${safe(o.order_no)}</b></div>`;return}result.className="result";result.innerHTML=`<div class="steps">${labels.map((label,i)=>`<div class="step ${i<=Number(o.status)?"done":""}"><i>${i<=Number(o.status)?"✓":"○"}</i><b>${label}</b></div>`).join("")}</div><p class="notice">الطلب: <b>${safe(o.order_no)}</b> — ${safe(o.product)} — الوجهة: ${safe(o.city)}</p>`}catch(error){result.innerHTML=`<div class="empty">${safe(error.message)}</div>`}});
const query=new URLSearchParams(location.search).get("order");if(query){orderNo.value=query;form.requestSubmit()}
</script></body></html>
