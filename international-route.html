<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123047">
<title>خط السير الدولي | الرفاعي للشحن الدولي</title>
<style>
:root{--navy:#123047;--blue:#176b87;--gold:#b8892f;--cream:#f7f3ea;--white:#fff;--text:#17212b;--muted:#66727c;--line:#dfe5e8;--ok:#16834a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}a{text-decoration:none;color:inherit}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
.top{background:var(--navy);color:#fff}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:900;font-size:19px}.brand small{display:block;color:#e7c577;font-size:11px}.links{display:flex;gap:14px;font-size:13px}.links a{color:#fff}.links a:hover{color:#e7c577}
.hero{padding:42px 0 30px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.hero h1{font-size:clamp(30px,7vw,48px);margin:0 0 8px}.hero p{margin:0;color:#e6eff3;max-width:780px}.main{padding:24px 0 50px}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 35px rgba(18,48,71,.08)}.form-grid{display:grid;grid-template-columns:1fr 64px 1fr 1fr;gap:10px;align-items:end}.field label{display:block;font-size:12px;font-weight:900;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;min-height:52px;border:1px solid #cfd8dc;border-radius:12px;padding:11px 13px;background:#fff;font:inherit;outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,107,135,.12)}.swap{height:52px;border:1px solid var(--line);background:#f5f8fa;border-radius:12px;font-size:22px;cursor:pointer}.btn{min-height:52px;border:0;border-radius:12px;padding:11px 18px;background:var(--gold);color:#fff;font:inherit;font-weight:900;cursor:pointer}
.route-head{margin-top:20px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#123047,#176b87);color:#fff}.route-pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}.country{text-align:center}.flag{font-size:34px;display:block}.country small{display:block;color:#dbe9ee}.country b{font-size:22px}.arrow{font-size:30px;color:#e7c577}.mode{margin-top:10px;text-align:center;color:#e6eff3;font-size:13px}
.journey-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:22px 0 12px}.journey-title h2{font-size:20px;margin:0}.journey-title small{color:var(--muted)}.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;overflow-x:auto;padding:3px 1px 10px}.phase{min-width:125px;min-height:140px;border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center;background:#fff}.phase i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;background:#eef3f5;font-style:normal;font-size:19px}.phase b{display:block;font-size:12px;line-height:1.5}.phase small{display:block;margin-top:6px;color:var(--muted);font-size:10px}.phase:first-child,.phase:last-child{border-color:#a9d5be;background:#f5fbf7}.phase:first-child i,.phase:last-child i{background:var(--ok);color:#fff}
.summary{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fafcfd}.card small{display:block;color:var(--muted);font-size:11px}.card b{display:block;margin-top:4px}.note{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff8e9;color:#765819;font-size:13px}.track-box{margin-top:16px;display:flex;gap:8px;align-items:center}.track-box input{flex:1;min-height:48px;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font:inherit;text-transform:uppercase}.track-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:11px;padding:10px 15px;background:var(--navy);color:#fff;font-weight:900}
footer{background:#0b2334;color:#dbe5ea;padding:22px 0}.foot{display:flex;align-items:center;justify-content:space-between;gap:15px}.foot a{color:#e7c577;font-weight:800}
@media(max-width:800px){.links{display:none}.form-grid{grid-template-columns:1fr 58px 1fr}.form-grid .mode-field{grid-column:1/-1}.timeline{display:flex}.summary{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.wrap{width:min(100% - 22px,1100px)}.form-grid{grid-template-columns:1fr 52px 1fr}.field input,.field select,.swap,.btn{min-height:48px}.btn{grid-column:1/-1}.route-pair{gap:8px}.country b{font-size:17px}.flag{font-size:29px}.arrow{font-size:23px}.summary{grid-template-columns:1fr}.track-box{flex-direction:column}.track-box input,.track-link{width:100%}.foot{display:block;text-align:center}.foot a{display:block;margin-top:5px}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>خطوط سير دولية مرنة</small></a><nav class="links"><a href="/">الرئيسية</a><a href="/products.html">المنتجات</a><a href="/services.html">الخدمات</a><a href="/tracking.html">التتبع</a><a href="/account.html">حسابي</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>خط سير الشحنات الدولية</h1><p>حدد بلد الإرسال وبلد الوصول ونوع النقل، وستظهر لك مراحل خط السير الدولي بصورة واضحة من الاستلام حتى التسليم.</p></div></section>
<main class="main"><div class="wrap"><section class="panel">
<div class="form-grid">
  <div class="field"><label for="originCountry">بلد الإرسال</label><input id="originCountry" list="countries" value="السعودية" placeholder="اكتب اسم البلد"></div>
  <button class="swap" id="swapBtn" type="button" aria-label="تبديل البلدين">⇄</button>
  <div class="field"><label for="destinationCountry">بلد الوصول</label><input id="destinationCountry" list="countries" value="السودان" placeholder="اكتب اسم البلد"></div>
  <div class="field mode-field"><label for="shippingMode">نوع النقل</label><select id="shippingMode"><option value="sea">بحري 🚢</option><option value="air">جوي ✈️</option><option value="land">بري 🚚</option></select></div>
  <button class="btn" id="buildBtn" type="button">إنشاء خط السير</button>
</div>
<datalist id="countries"><option value="السعودية"><option value="السودان"><option value="الإمارات"><option value="مصر"><option value="البحرين"><option value="الكويت"><option value="قطر"><option value="عُمان"><option value="الأردن"><option value="اليمن"><option value="تركيا"><option value="الصين"><option value="الهند"><option value="باكستان"><option value="بريطانيا"><option value="الولايات المتحدة"><option value="ألمانيا"><option value="فرنسا"><option value="إيطاليا"></datalist>
<div id="routeView"></div>
<div class="track-box"><input id="orderNo" placeholder="رقم الشحنة للتتبع — مثال RIF-1234"><a id="trackLink" class="track-link" href="/tracking.html">تتبع شحنة موجودة</a></div>
</section></div></main>
<footer><div class="wrap foot"><span>الرفاعي للشحن الدولي</span><a href="/">العودة للرئيسية</a></div></footer>
<script>
const $=id=>document.getElementById(id);
const modes={sea:{label:'شحن بحري',icon:'🚢',exit:'ميناء المغادرة',transit:'إبحار دولي',entry:'ميناء الوصول'},air:{label:'شحن جوي',icon:'✈️',exit:'مطار المغادرة',transit:'رحلة جوية دولية',entry:'مطار الوصول'},land:{label:'شحن بري',icon:'🚚',exit:'منفذ المغادرة',transit:'عبور بري دولي',entry:'منفذ الوصول'}};
const flags={'السعودية':'🇸🇦','السودان':'🇸🇩','الإمارات':'🇦🇪','مصر':'🇪🇬','البحرين':'🇧🇭','الكويت':'🇰🇼','قطر':'🇶🇦','عُمان':'🇴🇲','الأردن':'🇯🇴','اليمن':'🇾🇪','تركيا':'🇹🇷','الصين':'🇨🇳','الهند':'🇮🇳','باكستان':'🇵🇰','بريطانيا':'🇬🇧','الولايات المتحدة':'🇺🇸','ألمانيا':'🇩🇪','فرنسا':'🇫🇷','إيطاليا':'🇮🇹'};
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flag(country){return flags[country]||'🌍'}
function buildRoute(){const origin=$('originCountry').value.trim()||'السعودية',destination=$('destinationCountry').value.trim()||'السودان',mode=modes[$('shippingMode').value]||modes.sea;const phases=[['📦','استلام الشحنة',origin],['🏢','مركز التجميع والتجهيز',origin],['🛃',mode.exit,origin],[mode.icon,mode.transit,origin+' ← '+destination],['📍',mode.entry,destination],['🧾','التخليص الجمركي',destination],['✅','التوصيل والتسليم',destination]];$('routeView').innerHTML=`<div class="route-head"><div class="route-pair"><div class="country"><span class="flag">${flag(origin)}</span><small>بلد الإرسال</small><b>${esc(origin)}</b></div><div class="arrow">←</div><div class="country"><span class="flag">${flag(destination)}</span><small>بلد الوصول</small><b>${esc(destination)}</b></div></div><div class="mode">${mode.icon} ${mode.label}</div></div><div class="journey-title"><h2>مراحل خط السير</h2><small>7 مراحل رئيسية</small></div><div class="timeline">${phases.map((p,i)=>`<div class="phase"><i>${p[0]}</i><b>${esc(p[1])}</b><small>${esc(p[2])}</small></div>`).join('')}</div><div class="summary"><div class="card"><small>نقطة البداية</small><b>${flag(origin)} ${esc(origin)}</b></div><div class="card"><small>وسيلة النقل</small><b>${mode.icon} ${mode.label}</b></div><div class="card"><small>الوجهة النهائية</small><b>${flag(destination)} ${esc(destination)}</b></div></div><div class="note">المسار المعروض هو خط سير تشغيلي عام. الموانئ أو المطارات ونقاط العبور الفعلية تُحدد حسب شركة النقل والحجز الخاص بكل شحنة.</div>`;const params=new URLSearchParams(location.search);params.set('from',origin);params.set('to',destination);params.set('mode',$('shippingMode').value);history.replaceState(null,'',location.pathname+'?'+params.toString())}
$('buildBtn').addEventListener('click',buildRoute);$('swapBtn').addEventListener('click',()=>{const a=$('originCountry').value;$('originCountry').value=$('destinationCountry').value;$('destinationCountry').value=a;buildRoute()});$('orderNo').addEventListener('input',()=>{const v=$('orderNo').value.trim().toUpperCase();$('trackLink').href='/tracking.html'+(v?'?order='+encodeURIComponent(v):'')});
const qs=new URLSearchParams(location.search);if(qs.get('from'))$('originCountry').value=qs.get('from');if(qs.get('to'))$('destinationCountry').value=qs.get('to');if(modes[qs.get('mode')])$('shippingMode').value=qs.get('mode');buildRoute();
</script>
</body>
</html>
