<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشراكات | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css"></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>حلول توريد وشحن للشركات</small></a><nav class="links"><a href="/">الرئيسية</a><a href="/products.html">المنتجات</a><a href="/tracking.html">تتبع الطلب</a><a href="/partners.html">الشركاء</a><a href="/#accountArea">حسابي</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>انضم إلى شبكة شركائنا</h1><p>للموردين والمتاجر وشركات التوزيع: أرسل بياناتك وسيتواصل معك فريق الرفاعي لمراجعة فرص التعاون.</p></div></section>
<main class="main"><div class="wrap"><section class="panel"><form id="partnerForm" class="form-grid"><div><label for="company">اسم الشركة *</label><input id="company" class="field" required></div><div><label for="name">اسم المسؤول *</label><input id="name" class="field" required></div><div><label for="phone">رقم الجوال *</label><input id="phone" class="field" inputmode="tel" required></div><div><label for="city">المدينة</label><input id="city" class="field"></div><div class="wide"><label for="products">المنتجات أو الخدمات</label><input id="products" class="field"></div><div class="wide"><label for="details">تفاصيل إضافية</label><textarea id="details" class="field"></textarea></div><div class="wide actions"><button class="btn primary" type="submit">إرسال طلب الشراكة</button><a class="btn whatsapp" href="https://wa.me/966540407193?text=السلام%20عليكم،%20أرغب%20في%20التعاون%20مع%20منصة%20الرفاعي" target="_blank" rel="noopener">محادثة واتساب</a></div></form><div id="message" class="result"></div></section></div></main>
<footer><div class="wrap footer-row"><span>الرفاعي للشحن الدولي</span><a href="/terms.html">الشروط والسياسات</a></div></footer>
<script>
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
partnerForm.addEventListener("submit",async e=>{e.preventDefault();const button=partnerForm.querySelector('button[type="submit"]');button.disabled=true;message.className="result notice";message.textContent="جاري إرسال الطلب…";try{const r=await fetch("/api/partners",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company:company.value.trim(),name:name.value.trim(),phone:phone.value.trim(),city:city.value.trim(),products:products.value.trim(),details:details.value.trim()})}),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر الإرسال");partnerForm.reset();message.innerHTML=`تم استلام طلب الشراكة بنجاح. رقم المرجع: <b>${safe(d.refNo)}</b>`}catch(error){message.textContent=error.message}finally{button.disabled=false}});
</script></body></html>
