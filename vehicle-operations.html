<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة شحن السيارات | الرفاعي</title><link rel="stylesheet" href="/public-sections.css"><style>.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar .field{max-width:320px}.ops{display:grid;gap:14px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.meta{color:#6c7480;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.wide{grid-column:1/-1}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f6ead0;color:#76520f;font-weight:800}.status{font-weight:900}.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.stat{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat b{font-size:22px;display:block}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.statbar{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.statbar{grid-template-columns:1fr 1fr}}</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/cars.html"><span>الرفاعي للشحن الدولي</span><small>إدارة شحن السيارات</small></a><nav class="links"><a id="adminLink" class="hidden" href="/admin">لوحة المدير</a><a href="/cars.html">معرض السيارات</a><a href="/vehicle-shipping.html">صفحة العميل</a><button class="btn secondary hidden" id="logoutButton" type="button" onclick="logout()">خروج</button></nav></div></header>
<section class="hero"><div class="wrap"><h1>🚗 شحن وتوصيل السيارات</h1><p>إدارة طلبات التصدير النهائي والتربتك من استلام الطلب حتى الجمارك والوصول والتسليم.</p></div></section>
<main class="main"><div class="wrap"><section id="loginPanel" class="panel hidden" style="max-width:520px;margin:auto"><h2>دخول مندوب السيارات</h2><p class="meta">استخدم رقم الجوال وكلمة المرور المخصصة للمندوب.</p><form id="loginForm"><label>رقم الجوال</label><input id="loginPhone" class="field" inputmode="tel" required><label>كلمة المرور</label><input id="loginPassword" class="field" type="password" required><button class="btn primary" type="submit">دخول</button></form></section><div id="operationsPanel" class="hidden"><div id="stats" class="statbar"></div><section class="panel"><div class="toolbar"><input id="search" class="field" placeholder="بحث برقم الطلب، العميل، السيارة أو اللوحة"><select id="filter" class="field"><option value="">جميع الحالات</option></select><button class="btn secondary" onclick="load()">تحديث</button></div><div id="ops" class="ops"></div></section></div></div></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let data=[],statuses={},serviceTypes={};
async function api(path,options={}){const r=await fetch(path,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"حدث خطأ");return d}function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function optionMap(map,selected){return Object.entries(map).map(([k,v])=>`<option value="${esc(k)}" ${k===selected?"selected":""}>${esc(v)}</option>`).join("")}
function card(v){return `<div class="card" data-search="${esc([v.request_no,v.owner_name,v.owner_phone,v.vehicle_make,v.vehicle_model,v.plate_no,v.vin].join(" ").toLowerCase())}" data-status="${esc(v.status)}"><div class="head"><div><b>${esc(v.request_no)}</b> <span class="badge">${esc(serviceTypes[v.service_type]||v.service_type)}</span><div class="meta">${esc(v.owner_name)} — ${esc(v.owner_phone)}<br><b>${esc(v.vehicle_make)} ${esc(v.vehicle_model)}</b>${v.vehicle_year?` — ${esc(v.vehicle_year)}`:""}${v.vehicle_color?` — ${esc(v.vehicle_color)}`:""}<br>VIN: ${esc(v.vin||"-")} | اللوحة: ${esc(v.plate_no||"-")}</div></div><div class="status">${esc(statuses[v.status]||v.status)}</div></div><div class="grid">
<div><label>نوع الخدمة</label><select id="service_${v.id}" class="field">${optionMap(serviceTypes,v.service_type)}</select></div>
<div><label>الحالة</label><select id="status_${v.id}" class="field">${optionMap(statuses,v.status)}</select></div>
<div><label>الموظف المسؤول</label><input id="employee_${v.id}" class="field" value="${esc(v.assigned_employee||"")}"></div>
<div><label>جوال الموظف</label><input id="employeePhone_${v.id}" class="field" value="${esc(v.assigned_employee_phone||"")}"></div>
<div><label>مدينة الاستلام</label><input id="originCity_${v.id}" class="field" value="${esc(v.origin_city||"")}"></div>
<div><label>ميناء الشحن</label><input id="originPort_${v.id}" class="field" value="${esc(v.origin_port||"")}"></div>
<div><label>مدينة الوصول</label><input id="destinationCity_${v.id}" class="field" value="${esc(v.destination_city||"")}"></div>
<div><label>موعد استلام السيارة</label><input id="pickup_${v.id}" class="field" value="${esc(v.pickup_scheduled_at||"")}" placeholder="مثال: 2026-08-20 10:00"></div>
<div><label>رقم مستند التصدير</label><input id="exportDoc_${v.id}" class="field" value="${esc(v.export_doc_no||"")}"></div>
<div><label>رقم التربتك</label><input id="triptych_${v.id}" class="field" value="${esc(v.triptych_no||"")}"></div>
<div><label>انتهاء التربتك</label><input id="triptychExpiry_${v.id}" class="field" value="${esc(v.triptych_expiry||"")}"></div>
<div class="wide"><label>عنوان التوصيل</label><textarea id="address_${v.id}" class="field">${esc(v.destination_address||"")}</textarea></div>
<div class="wide"><label>ملاحظات التشغيل</label><textarea id="notes_${v.id}" class="field">${esc(v.notes||"")}</textarea></div>
<button class="btn primary wide" onclick="save(${v.id},'${esc(v.request_no)}')">حفظ وتحديث العميل</button></div>${v.shipped_at?`<div class="meta">تم الشحن: ${esc(v.shipped_at)}</div>`:""}${v.arrived_at?`<div class="meta">وصلت: ${esc(v.arrived_at)}</div>`:""}${v.delivered_at?`<div class="meta">تم التسليم: ${esc(v.delivered_at)}</div>`:""}</div>`}
function render(){const q=$("search").value.trim().toLowerCase(),f=$("filter").value;const rows=data.filter(v=>(!q||[v.request_no,v.owner_name,v.owner_phone,v.vehicle_make,v.vehicle_model,v.plate_no,v.vin].join(" ").toLowerCase().includes(q))&&(!f||v.status===f));$("ops").innerHTML=rows.length?rows.map(card).join(""):'<div class="empty">لا توجد طلبات مطابقة.</div>';const count=s=>data.filter(v=>v.status===s).length;$("stats").innerHTML=`<div class="stat"><span>إجمالي الطلبات</span><b>${data.length}</b></div><div class="stat"><span>قيد المعالجة</span><b>${data.filter(v=>!["delivered","issue"].includes(v.status)).length}</b></div><div class="stat"><span>تم الشحن</span><b>${count("shipped")+count("arrived_port")+count("customs_sudan")+count("out_for_delivery")}</b></div><div class="stat"><span>تم التسليم</span><b>${count("delivered")}</b></div>`}
async function save(id,no){try{const body={service_type:$("service_"+id).value,status:$("status_"+id).value,assigned_employee:$("employee_"+id).value.trim(),assigned_employee_phone:$("employeePhone_"+id).value.trim(),origin_city:$("originCity_"+id).value.trim(),origin_port:$("originPort_"+id).value.trim(),destination_city:$("destinationCity_"+id).value.trim(),pickup_scheduled_at:$("pickup_"+id).value.trim(),export_doc_no:$("exportDoc_"+id).value.trim(),triptych_no:$("triptych_"+id).value.trim(),triptych_expiry:$("triptychExpiry_"+id).value.trim(),destination_address:$("address_"+id).value.trim(),notes:$("notes_"+id).value.trim()};const d=await api("/api/admin/vehicle-shipments/"+encodeURIComponent(no),{method:"PUT",body:JSON.stringify(body)});toast(d.durable?"تم الحفظ والمزامنة مع Neon":"تم الحفظ");await load()}catch(e){toast(e.message)}}
function showLogin(){$("loginPanel").classList.remove("hidden");$("operationsPanel").classList.add("hidden");$("logoutButton").classList.add("hidden")}
function showOperations(role){$("loginPanel").classList.add("hidden");$("operationsPanel").classList.remove("hidden");$("logoutButton").classList.remove("hidden");if(role==="admin")$("adminLink").classList.remove("hidden")}
async function load(){try{const d=await api("/api/admin/vehicle-shipments");showOperations(d.role);data=d.shipments||[];statuses=d.statuses||{};serviceTypes=d.serviceTypes||{};$("filter").innerHTML='<option value="">جميع الحالات</option>'+Object.entries(statuses).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join("");render()}catch(e){if(e.message.includes("صلاحية")){showLogin();return}toast(e.message)}}
$("loginForm").addEventListener("submit",async event=>{event.preventDefault();try{const d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({phone:$("loginPhone").value.trim(),password:$("loginPassword").value})});if(!["admin","vehicle_agent"].includes(d.user?.role))throw new Error("هذا الحساب غير مصرح له بإدارة السيارات");await load()}catch(e){toast(e.message)}});
async function logout(){await api("/api/auth/logout",{method:"POST"});showLogin()}
$("search").addEventListener("input",render);$("filter").addEventListener("change",render);load();
</script></body></html>
