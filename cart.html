<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة والدفع | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css"><style>.cart-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.cart-item{display:grid;grid-template-columns:82px 1fr auto;gap:13px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0}.cart-image{width:82px;height:72px;background:#eef2f3;border-radius:11px;display:grid;place-items:center;font-size:35px;overflow:hidden}.cart-image img{width:100%;height:100%;object-fit:cover}.pay{display:grid;gap:8px}.pay label{padding:12px;border:1px solid var(--line);border-radius:10px}.success{text-align:center;padding:30px}@media(max-width:760px){.cart-layout{grid-template-columns:1fr}.cart-item{grid-template-columns:65px 1fr}.cart-image{width:65px;height:60px}.cart-item .remove{grid-column:1/-1}}</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>السلة وإكمال الطلب</small></a><nav class="links"><a href="/products.html">متابعة التسوق</a><a href="/tracking.html">التتبع</a><a href="/account.html">حسابي</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>السلة والدفع</h1><p>راجع المنتجات المختارة وحدد وسيلة الدفع وبيانات الوصول.</p></div></section>
<main class="main"><div class="wrap"><div id="success" class="panel success" style="display:none"></div><div id="cartLayout" class="cart-layout"><section class="panel"><h2>المنتجات المختارة</h2><div id="items"></div></section><section class="panel"><form id="checkout"><h2>بيانات الطلب</h2><label>الاسم *</label><input id="name" class="field" required><label>رقم الجوال / واتساب *</label><input id="phone" class="field" inputmode="tel" required><label>مدينة الوصول *</label><select id="city" class="field"><option>الخرطوم</option><option>الجزيرة</option><option>عطبرة</option><option>شندي</option></select><label>عنوان التوصيل</label><textarea id="address" class="field"></textarea><h3>وسيلة الدفع المفضلة</h3><div class="pay"><label><input type="radio" name="payment" value="card" checked> البطاقة البنكية</label><label><input type="radio" name="payment" value="tamara"> تمارا</label><label><input type="radio" name="payment" value="tabby"> تابي</label><label><input type="radio" name="payment" value="bank_transfer"> تحويل بنكي</label></div><label>ملاحظات</label><textarea id="details" class="field"></textarea><button class="btn primary" style="width:100%">إنشاء الطلب</button></form></section></div></div></main><div id="toast" class="toast"></div>
<script>
let cart=JSON.parse(localStorage.getItem("rifai_cart")||"[]");const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(path,options={}){const r=await fetch(path,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"حدث خطأ");return d}function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}function save(){localStorage.setItem("rifai_cart",JSON.stringify(cart));render()}
function render(){$("items").innerHTML=cart.length?cart.map((p,i)=>`<article class="cart-item"><div class="cart-image">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:esc(p.icon||"📦")}</div><div><b>${esc(p.name)}</b><br><span class="tag">${esc(p.cat||"منتج")}</span><div class="price">${esc(p.price||"حسب المورد")}</div></div><button class="btn secondary remove" onclick="remove(${i})">حذف</button></article>`).join(""):'<div class="empty">السلة فارغة. <a href="/products.html">تصفح المنتجات</a></div>';$('checkout').querySelector('button').disabled=!cart.length}function remove(i){cart.splice(i,1);save()}
async function prefill(){try{const me=await api("/api/me");if(!me.authenticated||me.user.role==="admin")return;const d=await api("/api/profile"),u=d.user;$("name").value=u.name||"";$("phone").value=u.phone||"";$("city").value=u.delivery_city||"الخرطوم";$("address").value=u.delivery_address||""}catch(e){}}
$("checkout").addEventListener("submit",async e=>{e.preventDefault();if(!cart.length)return toast("السلة فارغة");const grouped=cart.reduce((m,item)=>{const k=String(item.id);if(m[k])m[k].qty++;else m[k]={...item,qty:1,unitPrice:Number(String(item.price||"").replace(/[^0-9.]/g,""))||0,currency:"SAR"};return m},{}),payment=document.querySelector('input[name="payment"]:checked').value,labels={card:"البطاقة البنكية",tamara:"تمارا",tabby:"تابي",bank_transfer:"تحويل بنكي"};try{const d=await api("/api/orders",{method:"POST",body:JSON.stringify({name:$("name").value.trim(),phone:$("phone").value.trim(),product:cart.map(x=>x.name).join("، "),city:$("city").value,details:`عنوان التوصيل: ${$("address").value.trim()}\nوسيلة الدفع: ${labels[payment]}\n${$("details").value.trim()}`,items:Object.values(grouped)})});cart=[];save();$("cartLayout").style.display="none";$("success").style.display="block";$("success").innerHTML=`<h2>تم إنشاء طلبك بنجاح</h2><p>رقم الطلب: <b>${esc(d.orderNo)}</b></p><a class="btn primary" href="/tracking.html?order=${encodeURIComponent(d.orderNo)}">تتبع الطلب</a>`}catch(error){toast(error.message)}});render();prefill();
</script></body></html>
