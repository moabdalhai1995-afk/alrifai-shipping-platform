plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alrifai.shipping'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alrifai.shipping'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            def cleanEnv = { name ->
                def value = System.getenv(name)
                value == null ? null : value.trim()
            }
            def storePath = cleanEnv('ALRIFAI_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword cleanEnv('ALRIFAI_KEYSTORE_PASSWORD')
                keyAlias cleanEnv('ALRIFAI_KEY_ALIAS')
                keyPassword cleanEnv('ALRIFAI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
}
