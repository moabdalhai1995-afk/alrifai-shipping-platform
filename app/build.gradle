plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alrifai.shipping'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alrifai.shipping'
        minSdk 24
        targetSdk 35
        def buildVersionCode = System.getenv('ALRIFAI_VERSION_CODE')
        def buildVersionName = System.getenv('ALRIFAI_VERSION_NAME')
        def packageVersion = new groovy.json.JsonSlurper().parse(file('../package.json')).version.toString()
        versionCode buildVersionCode ? buildVersionCode.toInteger() : 6
        versionName buildVersionName ?: packageVersion
    }

    signingConfigs {
        release {
            def cleanEnv = { name ->
                def value = System.getenv(name)
                value == null ? null : value.trim()
            }
            def storePath = cleanEnv('ALRIFAI_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword cleanEnv('ALRIFAI_KEYSTORE_PASSWORD')
                keyAlias cleanEnv('ALRIFAI_KEY_ALIAS')
                keyPassword cleanEnv('ALRIFAI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
}
