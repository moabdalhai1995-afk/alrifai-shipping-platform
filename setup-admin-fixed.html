<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إعداد مدير المنصة — الرفاعي للشحن الدولي</title>
  <style>
    body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f7f3eb;color:#142033}
    .wrap{max-width:680px;margin:auto;padding:32px 18px 64px}
    .brand{font-size:30px;font-weight:800;margin:10px 0 6px}
    .sub{color:#6b7280;margin-bottom:28px}
    .card{background:#fff;border:1px solid #e6dfd3;border-radius:24px;padding:24px}
    h1{font-size:26px;margin:0 0 20px}
    label{display:block;font-weight:700;margin:16px 0 8px}
    input{width:100%;padding:15px 14px;border:1px solid #d8d2c7;border-radius:14px;font-size:18px;box-sizing:border-box}
    button{width:100%;margin-top:22px;padding:16px;border:0;border-radius:14px;background:#c58f25;color:#fff;font-size:19px;font-weight:800}
    .msg{margin-top:18px;padding:14px 16px;border-radius:12px;display:none;line-height:1.7}
    .ok{display:block;background:#ecfdf3;color:#067647}
    .err{display:block;background:#fef3f2;color:#b42318}
    .note{margin-top:18px;font-size:14px;color:#6b7280;line-height:1.8}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">الرفاعي للشحن الدولي</div>
    <div class="sub">إنشاء حساب المدير لأول مرة</div>
    <section class="card">
      <h1>إعداد حساب المدير</h1>
      <form id="setupForm">
        <label for="name">اسم المدير</label>
        <input id="name" required placeholder="مثال: مدير المنصة">

        <label for="phone">رقم الجوال</label>
        <input id="phone" inputmode="tel" required placeholder="05xxxxxxxx">

        <label for="password">كلمة المرور</label>
        <input id="password" type="password" minlength="8" required placeholder="8 أحرف على الأقل">

        <label for="setupKey">SETUP_KEY</label>
        <input id="setupKey" type="password" required placeholder="المفتاح الموجود في Render">

        <button id="submitBtn" type="submit">إنشاء المدير</button>
        <div id="msg" class="msg"></div>
      </form>
      <div class="note">بعد نجاح إنشاء المدير، احذف هذا الملف من GitHub أو غيّر قيمة SETUP_KEY في Render.</div>
    </section>
  </main>
  <script>
    const form=document.getElementById('setupForm');
    const msg=document.getElementById('msg');
    const btn=document.getElementById('submitBtn');

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      btn.disabled=true;
      btn.textContent='جاري إنشاء المدير...';
      msg.textContent='جاري الاتصال بالخادم وإنشاء حساب المدير...';
      msg.className='msg ok';
      const name=document.getElementById('name').value.trim();
      const phone=document.getElementById('phone').value.trim();
      const password=document.getElementById('password').value;
      const setupKey=document.getElementById('setupKey').value;
      try{
        const res=await fetch('/api/setup/admin',{
          method:'POST',
          headers:{'Content-Type':'application/json','x-setup-key':setupKey},
          body:JSON.stringify({name,phone,password})
        });
        const data=await res.json().catch(()=>({}));
        if(!res.ok) throw new Error(data.error||'تعذر إنشاء المدير');
        msg.textContent='تم إنشاء حساب المدير بنجاح. يمكنك الآن الدخول من صفحة الإدارة.';
        msg.className='msg ok';
        form.reset();
      }catch(err){
        msg.textContent=err.message||'حدث خطأ غير متوقع';
        msg.className='msg err';
      }finally{
        btn.disabled=false;
        btn.textContent='إنشاء المدير';
      }
    });
  </script>
</body>
</html>
