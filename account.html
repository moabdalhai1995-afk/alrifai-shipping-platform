<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123047"><title>حسابي | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css?v=3.8.4"><style>
/* Critical account-page styles are intentionally inline so the page remains usable even if the shared stylesheet is delayed or cached incorrectly inside Android WebView. */
:root{--navy:#123047;--blue:#176b87;--gold:#b8892f;--cream:#f7f3ea;--white:#fff;--text:#17212b;--muted:#66727c;--line:#dfe5e8;--ok:#16834a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{background:var(--navy);color:#fff;position:relative;z-index:5}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:20px;font-weight:800;white-space:nowrap}.brand small{display:block;color:#e7c577;font-size:11px}.links{display:flex;gap:16px;align-items:center;font-size:14px;white-space:nowrap}.links a{padding:8px 0}.hero{padding:48px 0 30px;background:linear-gradient(135deg,#123047,#176b87);color:#fff}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 6px}.hero p{max-width:680px;margin:0;color:#e2edf2}.main{padding:28px 0 56px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 35px #12304710;min-width:0}.account-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}.account-grid .wide{grid-column:1/-1}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.section-title h2,.panel h2{margin:0 0 14px;font-size:24px;color:var(--navy)}.section-title h2{margin:0}.field{display:block;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);outline:none;margin:0 0 12px}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #176b8718}.field:disabled{background:#f4f6f7;color:#59646d;opacity:1}label{display:block;font-weight:700;margin:10px 0 5px;color:#263745}textarea.field{min-height:105px;resize:vertical}.btn{border:0;border-radius:11px;padding:11px 16px;min-height:44px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--gold);color:#fff}.secondary{background:#e8f3f6;color:var(--blue)}.danger{background:#fff0ee;color:#a52219}.auth-tabs{display:flex;gap:8px;margin-bottom:15px}.auth-tabs button.active{background:var(--navy);color:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .wide{grid-column:1/-1}.item{padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:#fff;overflow-wrap:anywhere}.item .btn{margin-top:8px}.tag{display:inline-flex;color:var(--blue);background:#edf7fa;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}.empty{padding:24px 10px;text-align:center;color:var(--muted)}.notice{padding:14px;border-radius:11px;background:#eef7fa;color:var(--blue)}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);width:min(92vw,520px);text-align:center;background:#17212b;color:#fff;padding:12px 20px;border-radius:12px;z-index:50;box-shadow:0 10px 30px #0003}
@media(max-width:800px){.nav{display:block;padding:13px 0 10px}.brand{display:block;margin-bottom:9px}.links{overflow-x:auto;overflow-y:hidden;gap:10px;padding:2px 0 5px;scrollbar-width:none}.links::-webkit-scrollbar{display:none}.links a{background:#ffffff12;border-radius:999px;padding:7px 11px;flex:0 0 auto}.hero{padding:32px 0 24px}.main{padding:18px 0 42px}.account-grid{grid-template-columns:1fr}.account-grid .wide{grid-column:auto}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.panel{padding:18px;border-radius:16px}.section-title{align-items:flex-start}.section-title h2,.panel h2{font-size:22px}.section-title .btn{flex:0 0 auto}.field{font-size:16px}.account-grid>.panel>.primary{width:100%}.account-grid>.wide .btn{width:100%}}
@media(max-width:420px){.wrap{width:min(100% - 22px,1120px)}.hero h1{font-size:34px}.hero p{font-size:14px}.panel{padding:15px}.section-title{gap:8px}.section-title .btn{padding:9px 11px;font-size:13px}.auth-tabs .btn{flex:1;padding-inline:8px}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>حساب العميل</small></a><nav class="links" aria-label="التنقل الرئيسي"><a href="/">الرئيسية</a><a href="/products.html">المنتجات</a><a href="/services.html">الخدمات</a><a href="/calculator.html">الحاسبة</a><a href="/how-it-works.html">كيف تعمل</a><a href="/tracking.html">التتبع</a><a href="/cart.html">السلة</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>حسابي</h1><p>بياناتك وعناوينك وطلباتك والمفضلة وخدمة العملاء في صفحة واحدة.</p></div></section>
<main class="main"><div class="wrap"><section id="guest" class="panel"><div class="auth-tabs"><button id="loginTab" class="btn active" onclick="setMode('login')">تسجيل الدخول</button><button id="registerTab" class="btn secondary" onclick="setMode('register')">إنشاء حساب</button></div><form id="authForm" class="form-grid"><div id="nameField" style="display:none"><label for="authName">الاسم</label><input id="authName" class="field" autocomplete="name"></div><div id="phoneField" style="display:none"><label for="authPhone">الجوال</label><input id="authPhone" class="field" inputmode="tel" autocomplete="tel"></div><div><label for="authEmail">البريد الإلكتروني</label><input id="authEmail" class="field" type="email" autocomplete="email"></div><div><label for="authPassword">كلمة المرور</label><input id="authPassword" class="field" type="password" autocomplete="current-password" required></div><button class="btn primary wide">متابعة</button></form><p id="authMessage" class="notice" style="display:none"></p></section>
<section id="account" class="account-grid" style="display:none"><div class="panel"><div class="section-title"><h2>بياناتي</h2><button class="btn secondary" onclick="logout()">تسجيل الخروج</button></div><label for="profileName">الاسم</label><input id="profileName" class="field" autocomplete="name"><label for="profilePhone">الجوال</label><input id="profilePhone" class="field" disabled><label for="profileEmail">البريد الإلكتروني</label><input id="profileEmail" class="field" disabled><label for="profileCity">مدينة الوصول</label><select id="profileCity" class="field"><option>الخرطوم</option><option>الجزيرة</option><option>عطبرة</option><option>شندي</option></select><label for="profileAddress">عنوان التوصيل</label><textarea id="profileAddress" class="field"></textarea><button class="btn primary" onclick="saveProfile()">حفظ البيانات</button></div><div class="panel"><h2>طلباتي</h2><div id="orders"></div></div><div class="panel"><h2>المفضلة</h2><div id="favorites"></div></div><div class="panel"><h2>خدمة العملاء</h2><label for="supportSubject">عنوان الطلب</label><input id="supportSubject" class="field"><label for="supportMessage">التفاصيل</label><textarea id="supportMessage" class="field"></textarea><button class="btn primary" onclick="createTicket()">إرسال للدعم</button><div id="tickets"></div></div><div class="panel wide"><button class="btn danger" onclick="deleteAccount()">حذف الحساب والبيانات نهائيًا</button></div></section></div></main><div id="toast" class="toast"></div>
<script>
let mode="login";const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(path,options={}){const r=await fetch(path,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"حدث خطأ");return d}function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2800)}
function setMode(next){mode=next;const reg=mode==="register";$("nameField").style.display=reg?"block":"none";$("phoneField").style.display=reg?"block":"none";$("loginTab").classList.toggle("active",!reg);$("registerTab").classList.toggle("active",reg);$("authPassword").setAttribute("autocomplete",reg?"new-password":"current-password")}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();try{const d=await api(mode==="login"?"/api/auth/login":"/api/auth/register",{method:"POST",body:JSON.stringify({name:$("authName").value.trim(),phone:$("authPhone").value.trim(),email:$("authEmail").value.trim(),password:$("authPassword").value})});if(d.requiresVerification){$("authMessage").textContent=d.message;$("authMessage").style.display="block";return}await boot()}catch(error){toast(error.message)}});
async function boot(){try{const me=await api("/api/me");if(!me.authenticated){$("guest").style.display="block";$("account").style.display="none";return}if(me.user.role==="admin"){location.href="/admin";return}$("guest").style.display="none";$("account").style.display="grid";await Promise.all([loadProfile(),loadOrders(),loadFavorites(),loadTickets()])}catch(e){toast(e.message)}}
async function loadProfile(){const d=await api("/api/profile"),u=d.user;$("profileName").value=u.name||"";$("profilePhone").value=u.phone||"";$("profileEmail").value=u.email||"";$("profileCity").value=u.delivery_city||"الخرطوم";$("profileAddress").value=u.delivery_address||""}
async function saveProfile(){try{await api("/api/profile",{method:"PUT",body:JSON.stringify({name:$("profileName").value.trim(),delivery_city:$("profileCity").value,delivery_address:$("profileAddress").value.trim()})});toast("تم حفظ بياناتك")}catch(e){toast(e.message)}}
async function loadOrders(){const d=await api("/api/my-orders"),labels=["تم الاستلام","قيد التأكيد","تم التجهيز","تم الشحن","ملغي"];$('orders').innerHTML=d.orders.length?d.orders.map(o=>`<div class="item"><b>${esc(o.order_no)}</b><br>${esc(o.product)} — ${esc(o.city)}<br><span class="tag">${labels[o.status]||o.status}</span> <a href="/tracking.html?order=${encodeURIComponent(o.order_no)}">تتبع</a>${o.status<=1?` <button class="btn secondary" onclick="cancelOrder('${esc(o.order_no)}')">إلغاء</button>`:""}</div>`).join(""):'<div class="empty">لا توجد طلبات.</div>'}
async function cancelOrder(no){if(!confirm("إلغاء هذا الطلب؟"))return;try{await api("/api/my-orders/"+encodeURIComponent(no)+"/cancel",{method:"POST"});toast("تم إلغاء الطلب");loadOrders()}catch(e){toast(e.message)}}
async function loadFavorites(){const d=await api("/api/my-favorites");$("favorites").innerHTML=d.products.length?d.products.map(p=>`<div class="item"><b>${esc(p.name)}</b> — ${Number(p.price).toLocaleString("ar-SA")} ${esc(p.currency)} <button class="btn secondary" onclick="removeFavorite(${p.id})">إزالة</button></div>`).join(""):'<div class="empty">لا توجد منتجات مفضلة.</div>'}
async function removeFavorite(id){try{await api("/api/favorites/"+id,{method:"DELETE"});loadFavorites()}catch(e){toast(e.message)}}
async function loadTickets(){const d=await api("/api/my-support-tickets"),labels={open:"مفتوح",in_progress:"قيد المعالجة",resolved:"تم الحل",closed:"مغلق"};$("tickets").innerHTML=d.tickets.length?d.tickets.map(t=>`<div class="item"><b>${esc(t.ticket_no)} — ${esc(t.subject)}</b><br>${esc(t.message)}<br><span class="tag">${labels[t.status]||esc(t.status)}</span>${t.admin_reply?`<p><b>رد الدعم:</b> ${esc(t.admin_reply)}</p>`:""}</div>`).join(""):""}
async function createTicket(){try{await api("/api/my-support-tickets",{method:"POST",body:JSON.stringify({subject:$("supportSubject").value.trim(),message:$("supportMessage").value.trim()})});$("supportSubject").value="";$("supportMessage").value="";toast("تم إرسال طلب الدعم");loadTickets()}catch(e){toast(e.message)}}
async function logout(){await api("/api/auth/logout",{method:"POST"});boot()}async function deleteAccount(){if(!confirm("هل تريد حذف الحساب نهائيًا؟"))return;if(prompt('اكتب كلمة "حذف" للتأكيد')!=="حذف")return;try{await api("/api/profile",{method:"DELETE"});localStorage.removeItem("rifai_cart");toast("تم حذف الحساب");boot()}catch(e){toast(e.message)}}boot();
</script></body></html>
