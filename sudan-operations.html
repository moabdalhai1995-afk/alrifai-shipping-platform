<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33"><title>عمليات السودان | الرفاعي للشحن الدولي</title>
<style>
:root{--navy:#0b1f33;--gold:#c6922b;--line:#e4e7eb;--muted:#66717d;--bg:#f5f7f9;--ok:#13795b}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#14202d}.wrap{max-width:1200px;margin:auto;padding:16px}.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{color:#fff;text-decoration:none}.hero{background:linear-gradient(135deg,#0b1f33,#173b5f);color:#fff;border-radius:20px;padding:22px;margin:18px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.filters{display:flex;gap:8px;flex-wrap:wrap}.field,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.filters .field,.filters select{width:auto;min-width:190px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-right:4px solid var(--gold);border-radius:16px;padding:15px}.card h3{margin:0 0 7px}.meta{color:var(--muted);font-size:13px;line-height:1.8}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.form textarea{grid-column:1/-1;min-height:80px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--gold);color:#fff}.secondary{background:#edf2f6;color:var(--navy)}.tag{display:inline-block;border-radius:999px;background:#f7f1e5;color:#7d5816;padding:6px 10px;font-size:12px;font-weight:800}.empty{text-align:center;color:var(--muted);padding:28px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:11px;display:none;z-index:30}@media(max-width:760px){.grid,.form{grid-template-columns:1fr}.form textarea{grid-column:auto}.filters .field,.filters select{width:100%}}
</style></head>
<body>
<header class="top"><div class="wrap"><div><b>🇸🇩 عمليات السودان</b><div style="font-size:12px;color:#ccd6df">الرفاعي للشحن الدولي</div></div><a class="btn secondary" href="/admin">العودة للمدير</a></div></header>
<main class="wrap"><section class="hero"><h1>استلام الشحنات والتوصيل والتركيب</h1><p>إدارة الشحنة من وصولها للسودان وحتى تسليمها وتركيبها للعميل بواسطة موظفي الشركة.</p></section>
<section class="panel"><div class="filters"><input id="search" class="field" placeholder="بحث برقم الطلب أو العميل"><select id="statusFilter"><option value="">كل الحالات</option></select><button class="btn secondary" onclick="load()">تحديث</button></div></section><section id="list" class="grid"></section></main><div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let rows=[],statuses={};
async function api(path,options={}){const r=await fetch(path,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"حدث خطأ");return d}function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
async function boot(){try{const me=await api('/api/me');if(!me.authenticated||me.user.role!=='admin'){location.href='/admin';return}await load()}catch(e){location.href='/admin'}}
async function load(){try{const d=await api('/api/admin/sudan-fulfillment');rows=d.operations;statuses=d.statuses;$("statusFilter").innerHTML='<option value="">كل الحالات</option>'+Object.entries(statuses).map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');render()}catch(e){toast(e.message)}}
function render(){const q=$("search").value.trim().toLowerCase(),f=$("statusFilter").value;const filtered=rows.filter(x=>(!f||(x.status||'awaiting_receipt')===f)&&(!q||[x.order_no,x.customer_name,x.phone,x.product,x.sudan_city,x.order_city].some(v=>String(v||'').toLowerCase().includes(q))));$("list").innerHTML=filtered.length?filtered.map(card).join(''):'<div class="panel empty">لا توجد عمليات مطابقة.</div>'}
function card(x){const st=x.status||'awaiting_receipt';return `<article class="card"><div><span class="tag">${esc(statuses[st]||st)}</span><h3>${esc(x.order_no)} — ${esc(x.customer_name)}</h3><div class="meta">${esc(x.product)}<br>جوال العميل: ${esc(x.phone)}<br>وجهة الطلب: ${esc(x.order_city)}</div></div><div class="form"><select id="st-${x.order_no}">${Object.entries(statuses).map(([v,l])=>`<option value="${esc(v)}" ${v===st?'selected':''}>${esc(l)}</option>`).join('')}</select><input id="emp-${x.order_no}" class="field" placeholder="اسم الموظف المسؤول" value="${esc(x.employee_name||'')}"><input id="phone-${x.order_no}" class="field" placeholder="جوال الموظف" value="${esc(x.employee_phone||'')}"><input id="city-${x.order_no}" class="field" placeholder="المدينة في السودان" value="${esc(x.sudan_city||x.order_city||'')}"><input id="addr-${x.order_no}" class="field" placeholder="عنوان التوصيل" value="${esc(x.delivery_address||'')}"><input id="date-${x.order_no}" class="field" type="datetime-local" value="${esc((x.delivery_scheduled_at||'').slice(0,16))}"><textarea id="notes-${x.order_no}" placeholder="ملاحظات فريق السودان">${esc(x.notes||'')}</textarea><button class="btn primary" onclick="save('${esc(x.order_no)}')">حفظ وتحديث العميل</button></div></article>`}
async function save(no){try{const payload={status:$(`st-${no}`).value,employee_name:$(`emp-${no}`).value,employee_phone:$(`phone-${no}`).value,sudan_city:$(`city-${no}`).value,delivery_address:$(`addr-${no}`).value,delivery_scheduled_at:$(`date-${no}`).value,notes:$(`notes-${no}`).value};const d=await api('/api/admin/sudan-fulfillment/'+encodeURIComponent(no),{method:'PUT',body:JSON.stringify(payload)});toast(d.durable?'تم الحفظ والمزامنة الدائمة':'تم الحفظ محليًا وسيعاد ربط Neon عند توفرها');await load()}catch(e){toast(e.message)}}
$("search").addEventListener('input',render);$("statusFilter").addEventListener('change',render);boot();
</script></body></html>
