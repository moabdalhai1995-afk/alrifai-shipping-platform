<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة الشحن | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css"><style>.estimate{font-size:34px;font-weight:900;color:var(--gold);margin:8px 0}</style></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>تقدير تكلفة الشحن</small></a><nav class="links"><a href="/">الرئيسية</a><a href="/services.html">الخدمات</a><a href="/how-it-works.html">كيف تعمل</a><a href="/tracking.html">التتبع</a><a href="/account.html">حسابي</a></nav></div></header><section class="hero"><div class="wrap"><h1>حاسبة الشحن التقديرية</h1><p>احصل على تقدير أولي حسب نوع الشحنة والوزن والوجهة. السعر النهائي يعتمد على القياسات الفعلية والتوفر.</p></div></section><main class="main"><div class="wrap"><section class="panel"><form id="calc" class="form-grid"><div><label>الوجهة</label><select id="city" class="field"><option value="khartoum">الخرطوم</option><option value="jazira">الجزيرة</option><option value="atbara">عطبرة</option><option value="shendi">شندي</option></select></div><div><label>نوع الشحنة</label><select id="type" class="field"><option value="carton">كرتون</option><option value="barrel">برميل</option><option value="parcel">طرد</option><option value="commercial">شحنة تجارية</option><option value="container">حاوية</option></select></div><div><label>الوزن بالكيلوجرام</label><input id="weight" class="field" type="number" min="1" value="10"></div><div><label>العدد</label><input id="qty" class="field" type="number" min="1" value="1"></div><button class="btn primary wide">احسب التقدير</button></form><div id="result" class="result notice" style="display:none"></div></section></div></main><footer><div class="wrap footer-row"><span>التقدير غير ملزم حتى اعتماد عرض السعر</span><a href="/cart.html">إنشاء طلب</a></div></footer><script>calc.addEventListener("submit",e=>{e.preventDefault();const w=Math.max(1,Number(weight.value)||1),q=Math.max(1,Number(qty.value)||1),t=type.value;if(t==="barrel"||t==="carton"){result.style.display="block";result.innerHTML=`<div>التقدير المبدئي</div><div class="estimate">عرض سعر مخصص</div><small>سعر ${t==="barrel"?"البرميل":"الكرتون"} يعتمد على الحجم والوزن والمحتويات والوجهة، وسيتم تأكيده قبل اعتماد الطلب.</small>`;return}let base=t==="parcel"?35:t==="commercial"?28:1200,cityFee=city.value==="khartoum"?0:city.value==="jazira"?25:city.value==="atbara"?45:50,total=t==="container"?base:base+w*5+(q-1)*10+cityFee;result.style.display="block";result.innerHTML=`<div>التقدير المبدئي</div><div class="estimate">${total.toLocaleString("ar-SA")} ريال سعودي</div><small>سيتم تأكيد السعر النهائي بعد مراجعة الوزن والحجم ونوع البضاعة.</small>`})</script></body></html>
