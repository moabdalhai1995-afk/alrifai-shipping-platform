name: Add TikTok profile link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-tiktok-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-social-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add TikTok link to footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'الرياض – السعودية</p></div></div></footer>'
          replacement = 'الرياض – السعودية<br>TikTok: <a href="https://www.tiktok.com/@alrifoao6za" target="_blank" rel="noopener noreferrer">@alrifoao6za</a></p></div></div></footer>'
          if 'https://www.tiktok.com/@alrifoao6za' not in text:
              if marker not in text:
                  raise SystemExit('Footer marker not found in index.html')
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow after patch
        run: rm -f .github/workflows/add-tiktok-link.yml

      - name: Commit TikTok link
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-tiktok-link.yml
          git commit -m "feat: link TikTok profile in platform footer"
          git push
