name: Add official contact email

on:
  push:
    paths:
      - '.github/workflows/add-contact-email.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add email to footer contact section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          email = 'alrifaishipping@gmail.com'
          if f'mailto:{email}' not in text:
              marker = 'الرياض – السعودية'
              replacement = f'البريد الإلكتروني: <a href="mailto:{email}">{email}</a><br>{marker}'
              if marker not in text:
                  raise SystemExit('Contact location marker not found')
              text = text.replace(marker, replacement, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "الرفاعي للشحن الدولي"
          git config user.email "alrifaishipping@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add official email to platform contact section"
          git push
