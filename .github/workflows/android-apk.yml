name: Build Android Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ALRIFAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alrifai-release.jks"

      - name: Resolve and verify signing credentials
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD_INPUT: ${{ secrets.ALRIFAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS_INPUT: ${{ secrets.ALRIFAI_KEY_ALIAS }}
          KEY_PASSWORD_INPUT: ${{ secrets.ALRIFAI_KEY_PASSWORD }}
        run: |
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_INPUT" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_INPUT" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD_INPUT" | tr -d '\r\n')"
          mkdir -p "$RUNNER_TEMP/signing-test"
          echo verification > "$RUNNER_TEMP/signing-test/content.txt"
          jar --create --file "$RUNNER_TEMP/signing-test.jar" -C "$RUNNER_TEMP/signing-test" .
          if jarsigner -keystore "$RUNNER_TEMP/alrifai-release.jks" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$RUNNER_TEMP/signing-test.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
            RESOLVED_KEY_PASSWORD="$KEY_PASSWORD"
          else
            jar --create --file "$RUNNER_TEMP/signing-test.jar" -C "$RUNNER_TEMP/signing-test" .
            if ! jarsigner -keystore "$RUNNER_TEMP/alrifai-release.jks" -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" "$RUNNER_TEMP/signing-test.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "Signing credentials do not unlock the selected key" >&2
              exit 1
            fi
            RESOLVED_KEY_PASSWORD="$STORE_PASSWORD"
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$RESOLVED_KEY_PASSWORD"
          printf 'ALRIFAI_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/alrifai-release.jks" >> "$GITHUB_ENV"
          printf 'ALRIFAI_KEYSTORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'ALRIFAI_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'ALRIFAI_KEY_PASSWORD=%s\n' "$RESOLVED_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Build PR test APK
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signed release files
        if: github.event_name != 'pull_request'
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AlRifai-Shipping-v1.2.0-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AlRifai-Shipping-v1.2.0-Google-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
