name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # All third-party actions are pinned to full-length commit SHAs for repository policy compliance.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install platform dependencies
        run: npm install --no-audit --no-fund

      - name: Validate production platform
        run: npm run check

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Resolve Android build version
        shell: bash
        run: |
          PLATFORM_VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="${{ github.run_number }}"
          test -n "$PLATFORM_VERSION"
          test "$VERSION_CODE" -gt 5
          printf 'ALRIFAI_VERSION_CODE=%s\n' "$VERSION_CODE" >> "$GITHUB_ENV"
          printf 'ALRIFAI_VERSION_NAME=%s\n' "$PLATFORM_VERSION" >> "$GITHUB_ENV"

      - name: Restore permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ALRIFAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alrifai-release.jks"

      - name: Resolve and verify signing credentials
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD_INPUT: ${{ secrets.ALRIFAI_KEYSTORE_PASSWORD }}
          KEY_ALIAS_INPUT: ${{ secrets.ALRIFAI_KEY_ALIAS }}
          KEY_PASSWORD_INPUT: ${{ secrets.ALRIFAI_KEY_PASSWORD }}
        run: |
          STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD_INPUT" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS_INPUT" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD_INPUT" | tr -d '\r\n')"
          mkdir -p "$RUNNER_TEMP/signing-test"
          echo verification > "$RUNNER_TEMP/signing-test/content.txt"
          jar --create --file "$RUNNER_TEMP/signing-test.jar" -C "$RUNNER_TEMP/signing-test" .
          if jarsigner -keystore "$RUNNER_TEMP/alrifai-release.jks" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" "$RUNNER_TEMP/signing-test.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
            RESOLVED_KEY_PASSWORD="$KEY_PASSWORD"
          else
            jar --create --file "$RUNNER_TEMP/signing-test.jar" -C "$RUNNER_TEMP/signing-test" .
            jarsigner -keystore "$RUNNER_TEMP/alrifai-release.jks" -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" "$RUNNER_TEMP/signing-test.jar" "$KEY_ALIAS" >/dev/null 2>&1
            RESOLVED_KEY_PASSWORD="$STORE_PASSWORD"
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$RESOLVED_KEY_PASSWORD"
          printf 'ALRIFAI_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/alrifai-release.jks" >> "$GITHUB_ENV"
          printf 'ALRIFAI_KEYSTORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'ALRIFAI_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'ALRIFAI_KEY_PASSWORD=%s\n' "$RESOLVED_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request'
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Build PR test APK
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify signed release files
        if: github.event_name != 'pull_request'
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tarteeb-Shipping-Android-${{ github.run_number }}-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tarteeb-Shipping-Android-${{ github.run_number }}-Google-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TAG="tarteeb-android-v${ALRIFAI_VERSION_NAME}-build-${ALRIFAI_VERSION_CODE}"
          APK_NAME="Tarteeb-Shipping-v${ALRIFAI_VERSION_NAME}-build-${ALRIFAI_VERSION_CODE}.apk"
          AAB_NAME="Tarteeb-Shipping-v${ALRIFAI_VERSION_NAME}-build-${ALRIFAI_VERSION_CODE}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$APK_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/$AAB_NAME"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/$APK_NAME" "$RUNNER_TEMP/$AAB_NAME" --target "$GITHUB_SHA" --title "ترتيب للشحن والخدمات Android v${ALRIFAI_VERSION_NAME}" --notes "إصدار Production Stable موقّع تلقائيًا بعد اجتياز فحوصات المنصة. versionCode=${ALRIFAI_VERSION_CODE}." --latest
