name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ALRIFAI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/alrifai-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ALRIFAI_KEYSTORE_PATH: ${{ runner.temp }}/alrifai-release.jks
          ALRIFAI_KEYSTORE_PASSWORD: ${{ secrets.ALRIFAI_KEYSTORE_PASSWORD }}
          ALRIFAI_KEY_ALIAS: ${{ secrets.ALRIFAI_KEY_ALIAS }}
          ALRIFAI_KEY_PASSWORD: ${{ secrets.ALRIFAI_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Build PR test APK
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        if: github.event_name != 'pull_request'
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AlRifai-Shipping-v1.2.0-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
