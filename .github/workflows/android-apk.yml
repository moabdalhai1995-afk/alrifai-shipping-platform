name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir -p android-build
          unzip -q AlRifaiShippingAndroid_READY.zip -d android-build
          echo "Extracted files:"
          find android-build -maxdepth 3 -type f | sort | head -100

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          GRADLEW=$(find android-build -type f -name gradlew | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside AlRifaiShippingAndroid_READY.zip"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.locate.outputs.project_dir }}" -type f -path "*/build/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK output was not found"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK built at: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlRifai-Shipping-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
