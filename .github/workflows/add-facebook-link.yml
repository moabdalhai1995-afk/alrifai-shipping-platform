name: Add Facebook profile link

on:
  push:
    paths:
      - '.github/workflows/add-facebook-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Facebook to footer contact section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          facebook_url = 'https://www.facebook.com/profile.php?id=61593886831361'
          if facebook_url not in text:
              marker = 'TikTok: <a href="https://www.tiktok.com/@alrifoao6za" target="_blank" rel="noopener noreferrer">@alrifoao6za</a>'
              replacement = 'Facebook: <a href="' + facebook_url + '" target="_blank" rel="noopener noreferrer">صفحة الرفاعي على Facebook</a><br>' + marker
              if marker not in text:
                  raise SystemExit('TikTok contact marker not found')
              text = text.replace(marker, replacement, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "الرفاعي للشحن الدولي"
          git config user.email "alrifaishipping@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: add Facebook profile to platform contact section"
          git push
