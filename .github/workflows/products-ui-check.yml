name: Products UI check

on:
  pull_request:
    paths:
      - "products.html"
      - ".github/workflows/products-ui-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify horizontal category strip above search
        run: |
          grep --quiet 'category-strip-shell' products.html
          grep --quiet 'category-chip active' products.html
          grep --quiet 'category-thumb' products.html
          grep --quiet 'categoryImage(category)' products.html
          grep --quiet 'buildCategories()' products.html
          grep --quiet 'activeCategory' products.html
          grep --quiet 'flex-wrap:nowrap' products.html
          grep --quiet 'overflow-x:auto' products.html
          python - <<'PY'
          from pathlib import Path
          html = Path('products.html').read_text(encoding='utf-8')
          strip = html.index('class="category-strip-shell"')
          search = html.index('class="toolbar products-toolbar"')
          main = html.index('<main class="main">')
          if not (main < strip < search):
              raise SystemExit('Category strip must be inside main content and immediately above search')
          PY
          if grep --quiet '<select id="category"' products.html; then
            echo 'Legacy category dropdown must not return'
            exit 1
          fi
