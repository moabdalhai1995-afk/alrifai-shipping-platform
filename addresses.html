<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d31"><title>دفتر العناوين | الرفاعي</title><style>
:root{--navy:#071d31;--gold:#c6932e;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6b7680;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#17222d;line-height:1.7}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.wrap{width:min(900px,calc(100% - 24px));margin:auto}.top{background:linear-gradient(115deg,#071d31,#113d5a);color:#fff}.top .wrap{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top b{font-size:18px}.top a{color:#e9ce8b;font-weight:900}.hero{padding:30px 0;background:#0d2b42;color:#fff}.hero h1{margin:0;font-size:clamp(28px,5vw,40px)}.hero p{margin:7px 0 0;color:#dce8ef}.main{padding:20px 0 50px}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 24px #071d310d}.panel h2{margin:0 0 12px;color:var(--navy)}label{display:block;font-size:13px;font-weight:900;margin:9px 0 5px}.field{width:100%;min-height:47px;border:1px solid #d6dde2;border-radius:11px;padding:10px 12px;outline:none}.field:focus{border-color:#79a7b8;box-shadow:0 0 0 3px #0e5e7814}textarea.field{min-height:88px}.check{display:flex;align-items:center;gap:8px;margin:11px 0}.check input{width:18px;height:18px;accent-color:var(--gold)}.btn{border:0;border-radius:10px;min-height:44px;padding:9px 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--gold),#a8751f);color:#fff}.danger{background:#fff0ee;color:var(--danger)}.address{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px;background:#fafcfd}.address.default{border-color:#d6b35f;background:#fff9e9}.address-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:#eef4f7;color:#22556d;font-size:11px;font-weight:900}.muted{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:28px}.toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#102536;color:#fff;padding:11px 16px;border-radius:11px;z-index:50;width:min(92vw,500px);text-align:center}@media(max-width:720px){.grid{grid-template-columns:1fr}.top .wrap{min-height:60px}.panel{padding:14px}.field{font-size:16px}}
</style></head><body><header class="top"><div class="wrap"><b>الرفاعي للشحن الدولي</b><a href="/account.html">العودة إلى حسابي</a></div></header><section class="hero"><div class="wrap"><h1>دفتر العناوين</h1><p>احفظ عناوين الاستلام والتوصيل لاستخدامها بسرعة عند إنشاء الطلبات.</p></div></section><main class="main"><div class="wrap grid"><section class="panel"><h2>إضافة عنوان</h2><form id="form"><label for="label">اسم العنوان</label><input id="label" class="field" placeholder="المنزل / المكتب"><label for="city">المدينة</label><select id="city" class="field"><option>الخرطوم</option><option>الجزيرة</option><option>عطبرة</option><option>شندي</option></select><label for="address">العنوان التفصيلي *</label><textarea id="address" class="field" required></textarea><label for="phone">رقم التواصل</label><input id="phone" class="field" inputmode="tel"><label class="check"><input id="isDefault" type="checkbox"> جعله العنوان الافتراضي</label><button class="btn primary" style="width:100%">حفظ العنوان</button></form></section><section class="panel"><h2>العناوين المحفوظة</h2><div id="list">جارٍ التحميل…</div></section></div></main><div id="toast" class="toast"></div><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',2500)}
async function load(){try{const d=await api('/api/pro/addresses');$('list').innerHTML=d.addresses.length?d.addresses.map(a=>`<article class="address ${a.is_default?'default':''}"><div class="address-head"><div><b>${esc(a.label)}</b> ${a.is_default?'<span class="badge">افتراضي</span>':''}<div>${esc(a.city)}</div><div class="muted">${esc(a.address)}</div>${a.phone?`<div class="muted">${esc(a.phone)}</div>`:''}</div><button class="btn danger" onclick="removeAddress(${a.id})">حذف</button></div></article>`).join(''):'<div class="empty">لا توجد عناوين محفوظة.</div>'}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message)}<br><a href="/account.html" style="color:#0e5e78;font-weight:900">تسجيل الدخول</a></div>`}}
async function removeAddress(id){try{await api('/api/pro/addresses/'+id,{method:'DELETE'});toast('تم حذف العنوان');load()}catch(e){toast(e.message)}}
$('form').onsubmit=async e=>{e.preventDefault();try{await api('/api/pro/addresses',{method:'POST',body:JSON.stringify({label:$('label').value.trim()||'العنوان الرئيسي',city:$('city').value,address:$('address').value.trim(),phone:$('phone').value.trim(),is_default:$('isDefault').checked})});$('address').value='';$('phone').value='';$('label').value='';$('isDefault').checked=false;toast('تم حفظ العنوان');load()}catch(e){toast(e.message)}};load();
</script></body></html>
