<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d31"><title>مستودع الرفاعي</title><style>
:root{--navy:#071d31;--gold:#c6932e;--bg:#f4f6f8;--line:#dfe5ea;--muted:#697580;--ok:#147a50;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#152334;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1200px,calc(100% - 24px));margin:24px auto}.hero{background:linear-gradient(135deg,#071d31,#124663);color:#fff;border-radius:22px;padding:24px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#d8e5ec}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 8px 24px #071d3109}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:29px;margin-top:5px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select,.field input{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}.tools input{flex:1;min-width:210px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.gold{background:var(--gold);color:#fff}.light{background:#eef2f5;color:var(--navy)}.danger{background:#fff0ee;color:var(--danger)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:820px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:right}.table th{background:#f7f1e5}.product{display:flex;align-items:center;gap:9px;font-weight:900}.product img{width:48px;height:48px;border-radius:9px;object-fit:cover;background:#eef2f5}.badge{display:inline-flex;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;background:#eef2f5}.ok{color:var(--ok);background:#eaf7f0}.warn{color:#8a621c;background:#fff7df}.out{color:var(--danger);background:#fff0ee}.empty{text-align:center;padding:35px;color:var(--muted)}dialog{border:0;border-radius:18px;padding:0;width:min(430px,calc(100% - 24px));box-shadow:0 24px 80px #0005}dialog::backdrop{background:#071d31b5}.modal{padding:22px}.modal h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input{width:100%}.actions{display:flex;gap:8px;justify-content:flex-end}.notice{padding:12px;border-radius:10px;background:#fff7df;margin-bottom:12px}.hidden{display:none!important}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{margin-top:14px}.hero{padding:19px}.panel{padding:12px}}
</style></head><body><main class="wrap"><section class="hero"><h1>🏬 المستودع والمخزون</h1><p>جميع المنتجات المسجلة في المنصة مع الكميات والحالة والمورد والأسعار.</p></section><section id="stats" class="stats"></section><section class="panel"><div class="tools"><input id="search" type="search" placeholder="ابحث باسم المنتج أو القسم أو المورد"><select id="filter"><option value="all">كل المنتجات</option><option value="available">متوفر</option><option value="low">مخزون منخفض</option><option value="out">نافد</option><option value="inactive">موقوف</option></select><button class="btn light" onclick="loadProducts()">↻ تحديث</button><a class="btn gold" href="/admin.html#products">＋ إضافة منتج</a></div><div id="content" class="empty">جاري تحميل المخزون…</div></section></main><dialog id="editDialog"><form class="modal" method="dialog" id="editForm"><h2>تحديث المنتج</h2><div class="notice" id="editName"></div><div class="field"><label>الكمية الحالية</label><input id="editStock" type="number" min="0" step="1" required></div><div class="field"><label>سعر البيع (ريال)</label><input id="editPrice" type="number" min="0" step="0.01" required></div><div class="actions"><button class="btn light" value="cancel">إلغاء</button><button class="btn gold" value="default" onclick="saveEdit(event)">حفظ</button></div></form></dialog><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],editing=null;const $=id=>document.getElementById(id);async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر تنفيذ العملية');return d}function state(p){if(!p.active)return['موقوف','inactive'];const q=Number(p.stock_quantity)||0;if(q<=0)return['نافد','out'];if(q<=5)return['منخفض','low'];return['متوفر','available']}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const rows=products.filter(p=>{const s=state(p)[1];return(f==='all'||s===f)&&(!q||[p.name,p.category,p.supplier_name].some(v=>String(v||'').toLowerCase().includes(q))) });const counts={all:products.length,available:0,low:0,out:0};products.forEach(p=>{const s=state(p)[1];if(counts[s]!=null)counts[s]++});$('stats').innerHTML=[['كل المنتجات',counts.all,'📦'],['المتوفر',counts.available,'✅'],['المنخفض',counts.low,'⚠️'],['النافد',counts.out,'🚫']].map(x=>`<div class="stat"><span>${x[2]} ${x[0]}</span><b>${x[1]}</b></div>`).join('');$('content').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>المنتج</th><th>القسم</th><th>المورد</th><th>الكمية</th><th>السعر</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${rows.map(p=>{const s=state(p);return`<tr><td><div class="product"><img src="${esc(p.image_url||'')}" alt="" onerror="this.style.visibility='hidden'"><span>${esc(p.name)}</span></div></td><td>${esc(p.category||'-')}</td><td>${esc(p.supplier_name||'-')}</td><td><b>${Number(p.stock_quantity)||0}</b></td><td>${Number(p.price||0).toLocaleString('ar-SA')} ${esc(p.currency||'SAR')}</td><td><span class="badge ${s[1]==='available'?'ok':s[1]==='low'?'warn':s[1]==='out'?'out':''}">${s[0]}</span></td><td><button class="btn gold" onclick="openEdit(${p.id})">تعديل</button> <a class="btn light" href="/admin.html#products">تفاصيل</a></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">لا توجد منتجات مطابقة.</div>'}async function loadProducts(){try{const me=await api('/api/me');if(!me.authenticated||!['admin','warehouse','sales_agent'].includes(me.user.role)){location.href='/admin.html';return}const d=await api('/api/admin/products');products=d.products||[];render()}catch(e){$('content').innerHTML=`<div class="empty">${esc(e.message)}<br><a href="/admin.html">تسجيل دخول المدير</a></div>`}}function openEdit(id){editing=products.find(p=>p.id===id);if(!editing)return;$('editName').textContent=editing.name;$('editStock').value=Number(editing.stock_quantity)||0;$('editPrice').value=Number(editing.price)||0;$('editDialog').showModal()}async function saveEdit(e){e.preventDefault();if(!editing)return;try{await api('/api/admin/products/'+editing.id,{method:'PATCH',body:JSON.stringify({stock_quantity:Math.max(0,Number($('editStock').value)||0),price:Math.max(0,Number($('editPrice').value)||0)})});$('editDialog').close();await loadProducts()}catch(err){alert(err.message)}}$('search').addEventListener('input',render);$('filter').addEventListener('change',render);loadProducts();
</script><script>
const renderWarehouseBase=render;
render=function renderPurchasePricesOnly(){
  renderWarehouseBase();
  const q=$('search').value.trim().toLowerCase(),f=$('filter').value;
  const visible=products.filter(p=>{const s=state(p)[1];return(f==='all'||s===f)&&(!q||[p.name,p.category,p.supplier_name].some(v=>String(v||'').toLowerCase().includes(q)))});
  const heading=document.querySelector('.table th:nth-child(5)');
  if(heading)heading.textContent='سعر الشراء';
  document.querySelectorAll('.table tbody tr').forEach((row,index)=>{
    const product=visible[index],cell=row.children[4];
    if(cell)cell.textContent=product&&product.purchase_price!=null?Number(product.purchase_price).toLocaleString('ar-SA')+' '+(product.currency||'SAR'):'غير محدد';
  });
};
const sellingPriceField=$('editPrice')?.closest('.field');
if(sellingPriceField)sellingPriceField.classList.add('hidden');
$('search').addEventListener('input',()=>render());
$('filter').addEventListener('change',()=>render());
</script></body></html>
