<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<title>إشعارات المدير | الرفاعي للشحن الدولي</title>
<style>
:root{--navy:#0b1f33;--navy2:#173a5b;--gold:#c6922b;--bg:#f4f6f8;--card:#fff;--line:#e0e5ea;--muted:#66717d;--ok:#13795b;--danger:#b42318;--shadow:0 8px 28px #0b1f3312}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#14202d;font-family:Tahoma,Arial,sans-serif;line-height:1.7}a{text-decoration:none;color:inherit}button,input,select,textarea{font:inherit}.wrap{max-width:1200px;margin:auto;padding:16px}.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 5px 22px #0002}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px;border-radius:13px;background:var(--gold);display:grid;place-items:center;font-size:23px}.brand h1{font-size:18px;margin:0}.brand small{display:block;color:#ced8e1}.actions{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:10px 14px;min-height:42px;font-weight:900;cursor:pointer}.gold{background:var(--gold);color:#fff}.light{background:#fff;color:var(--navy)}.soft{background:#edf2f6;color:var(--navy)}.hero{margin:18px 0;background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:21px;color:#fff;padding:21px}.hero h2{font-size:clamp(25px,5vw,37px);margin:0}.hero p{margin:4px 0 0;color:#d6e0e9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted)}.stat b{display:block;font-size:25px;color:var(--navy);margin-top:4px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.panel h3{margin:0 0 12px;color:var(--navy)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.wide{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:900;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7095ad;box-shadow:0 0 0 3px #176b8712}.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:11px}.check input{width:20px;height:20px}.hint{color:var(--muted);font-size:12px;margin-top:8px}.event{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;background:#fff}.event.admin{border-right:4px solid var(--gold)}.event h4{margin:0 0 4px}.event p{margin:0;color:#45525e;white-space:pre-wrap}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:11px}.tag{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf2f6;color:var(--navy);font-weight:900}.tag.offer{background:#fff3d9;color:#8a5d00}.tag.shipment{background:#e8f7f1;color:var(--ok)}.tag.system{background:#f0edfa;color:#6040a6}.status{padding:10px 12px;border-radius:10px;background:#f6f8f9;color:var(--muted);font-size:12px;margin-top:10px}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#17212b;color:#fff;padding:11px 17px;border-radius:11px;display:none;z-index:90;max-width:92%;text-align:center}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}@media(max-width:620px){.wrap{padding:12px}.top .wrap{align-items:flex-start}.brand small{display:none}.actions{display:grid;grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.stats{grid-template-columns:1fr}.hero{padding:17px}.panel{padding:14px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand"><div class="logo">🔔</div><div><h1>مركز إشعارات المدير</h1><small>الرفاعي للشحن الدولي</small></div></div><div class="actions"><a class="btn light" href="/admin/overview">لوحة المدير</a><a class="btn soft" href="/shipping-operations.html">تشغيل الشحن</a></div></div></header>
<main class="wrap"><section class="hero"><h2>الإشعارات والعروض</h2><p>تابع تغييرات الشحنات، وانشر تحديثات المنصة والعروض للعملاء، مع خيار الإرسال على واتساب.</p></section><section id="stats" class="stats"></section><div class="layout"><div>
<section class="panel"><h3>نشر إشعار جديد</h3><form id="broadcastForm" class="form-grid"><div class="field"><label>نوع الإشعار</label><select id="type"><option value="offer">🎁 عرض جديد</option><option value="system">⚙️ تحديث المنصة</option><option value="general">🔔 إشعار عام</option></select></div><div class="field"><label>الجمهور</label><select id="audience"><option value="customers">العملاء</option><option value="all">الجميع</option><option value="admins">المدير فقط</option></select></div><div class="field wide"><label>العنوان</label><input id="title" maxlength="180" required placeholder="مثال: عرض شحن البراميل هذا الأسبوع"></div><div class="field wide"><label>نص الإشعار</label><textarea id="body" rows="5" maxlength="1800" required placeholder="اكتب تفاصيل العرض أو التحديث..."></textarea></div><div class="field wide"><label>رابط الإجراء - اختياري</label><input id="actionUrl" placeholder="/products.html أو /tracking.html"></div><label class="check wide"><input id="sendWhatsapp" type="checkbox"><span><b>إرسال عبر واتساب أيضًا</b><br><small class="hint">يرسل للعملاء الذين فعّلوا موافقة واتساب.</small></span></label><button class="btn gold wide" type="submit">نشر الإشعار</button></form><div id="publishResult" class="status">سيظهر تقرير الإرسال هنا.</div></section>
<section class="panel"><h3>واتساب المدير</h3><div class="form-grid"><div class="field wide"><label>رقم واتساب المدير</label><input id="adminPhone" inputmode="tel" placeholder="مثال 0540407193"></div><label class="check wide"><input id="adminWaEnabled" type="checkbox"><span><b>إرسال تغييرات الشحنات للمدير على واتساب</b><br><small class="hint">يتطلب إعداد WhatsApp Business في الخادم.</small></span></label><button id="saveSettings" type="button" class="btn soft wide">حفظ إعدادات المدير</button></div><div id="waStatus" class="status"></div></section>
</div><section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3 style="margin:0">سجل الإشعارات</h3><button id="refresh" class="btn soft">↻ تحديث</button></div><div id="events"><div class="empty">جاري التحميل…</div></div></section></div></main><div id="toast" class="toast"></div>
<script>
let data={events:[],types:{},stats:{},settings:{}};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر إكمال العملية');return d}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2700)}function fmt(v){if(!v)return'';const d=new Date(String(v).includes('T')?v:String(v).replace(' ','T')+'Z');return Number.isNaN(d.getTime())?v:d.toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'})}
function render(){const s=data.stats||{};$('stats').innerHTML=[["العملاء",s.customer_count||0,"👥"],["موافقون على واتساب",s.whatsapp_opted_in||0,"💬"],["الإشعارات المسجلة",data.events.length||0,"🔔"]].map(x=>`<div class="stat"><small>${x[2]} ${x[0]}</small><b>${x[1]}</b></div>`).join('');$('adminPhone').value=data.settings?.admin_whatsapp_phone||'';$('adminWaEnabled').checked=!!data.settings?.admin_whatsapp_enabled;$('waStatus').textContent=data.settings?.whatsapp_configured?'✅ WhatsApp Business متصل. يمكن إرسال الإشعارات.':'⚠️ WhatsApp Business غير مكتمل الإعداد على الخادم.';$('events').innerHTML=data.events.length?data.events.map(e=>`<article class="event ${e.audience==='admins'?'admin':''}"><h4>${esc(e.title)}</h4><p>${esc(e.body)}</p><div class="meta"><span class="tag ${esc(e.notification_type)}">${esc(data.types[e.notification_type]||e.notification_type)}</span><span>${e.audience==='customers'?'العملاء':e.audience==='all'?'الجميع':'المدير'}</span>${e.order_no?`<span>الشحنة ${esc(e.order_no)}</span>`:''}${e.customer_name?`<span>${esc(e.customer_name)}</span>`:''}<span>${esc(fmt(e.created_at))}</span>${Number(e.whatsapp_requested||0)===1?'<span>💬 واتساب</span>':''}</div>${e.action_url?`<div style="margin-top:8px"><a href="${esc(e.action_url)}" style="color:#176b87;font-weight:900">فتح الرابط ←</a></div>`:''}</article>`).join(''):'<div class="empty">لا توجد إشعارات بعد.</div>'}
async function load(){try{data=await api('/api/admin/notification-center');render()}catch(e){if(/صلاحية المدير/.test(e.message)){location.href='/admin';return}toast(e.message);$('events').innerHTML='<div class="empty">تعذر تحميل الإشعارات.</div>'}}
$('broadcastForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/admin/notification-center/broadcast',{method:'POST',body:JSON.stringify({notification_type:$('type').value,audience:$('audience').value,title:$('title').value.trim(),body:$('body').value.trim(),action_url:$('actionUrl').value.trim(),whatsapp:$('sendWhatsapp').checked})});const w=d.whatsapp||{};$('publishResult').textContent=$('sendWhatsapp').checked?`تم نشر الإشعار. واتساب: أُرسل ${w.sent||0}، فشل ${w.failed||0}، تم تخطي ${w.skipped||0}.`:'تم نشر الإشعار داخل المنصة.';toast('تم نشر الإشعار');$('title').value='';$('body').value='';$('actionUrl').value='';$('sendWhatsapp').checked=false;await load()}catch(err){toast(err.message)}});
$('saveSettings').addEventListener('click',async()=>{try{await api('/api/admin/notification-center/settings',{method:'PUT',body:JSON.stringify({admin_whatsapp_phone:$('adminPhone').value.trim(),admin_whatsapp_enabled:$('adminWaEnabled').checked})});toast('تم حفظ إعدادات واتساب المدير');await load()}catch(e){toast(e.message)}});$('refresh').addEventListener('click',load);load();
</script>
</body></html>
