services:
  - type: web
    name: alrifai-shipping-platform
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
      - key: DB_FILE
        value: /var/data/alrifai.db
