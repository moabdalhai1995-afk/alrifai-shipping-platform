<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123047">
<title>الإشعارات | الرفاعي للشحن الدولي</title>
<style>
:root{--navy:#123047;--blue:#176b87;--gold:#b8892f;--cream:#f7f3ea;--white:#fff;--text:#17212b;--muted:#66727c;--line:#dfe5e8;--ok:#16834a;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.7}a{text-decoration:none;color:inherit}button,input{font:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:auto}.top{background:var(--navy);color:#fff}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:19px;font-weight:900}.brand small{display:block;color:#e7c577;font-size:11px}.back{background:#ffffff18;border-radius:11px;padding:9px 13px;color:#fff;font-weight:800}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:38px 0 28px}.hero-row{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.hero h1{font-size:clamp(30px,7vw,44px);margin:0}.hero p{margin:4px 0 0;color:#e6eff3}.badge{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 10px;border-radius:999px;background:var(--gold);font-weight:900}.main{padding:22px 0 50px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px #1230470d}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.section-head h2{margin:0;font-size:20px;color:var(--navy)}.btn{border:0;border-radius:10px;padding:9px 13px;min-height:42px;font-weight:900;cursor:pointer}.primary{background:var(--gold);color:#fff}.soft{background:#edf5f7;color:var(--blue)}.filters{display:flex;gap:7px;overflow:auto;margin:14px 0 2px}.filter{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 12px;white-space:nowrap;font-weight:800;color:var(--muted);cursor:pointer}.filter.active{background:var(--navy);border-color:var(--navy);color:#fff}.notification{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:#fff}.notification.unread{border-right:4px solid var(--gold);background:#fffdf7}.notification h3{font-size:16px;margin:0 0 4px}.notification p{margin:0;color:#45525e;white-space:pre-wrap}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:11px}.type{padding:3px 8px;border-radius:999px;background:#edf5f7;color:var(--blue);font-weight:900}.type.offer{background:#fff3d9;color:#8a5d00}.type.shipment{background:#eaf8f1;color:var(--ok)}.type.system{background:#f0edfa;color:#6040a6}.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}.link{font-weight:900;color:var(--blue)}.read{border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer}.empty{padding:34px;text-align:center;color:var(--muted)}.prefs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.pref{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.pref b{display:block}.pref small{display:block;color:var(--muted)}.switch{width:50px;height:28px;appearance:none;background:#ccd4d9;border-radius:999px;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}.switch:checked{background:var(--ok)}.switch:before{content:"";position:absolute;width:22px;height:22px;top:3px;right:3px;border-radius:50%;background:#fff;transition:.2s}.switch:checked:before{right:25px}.status{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f6f8f9;color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#17212b;color:#fff;padding:11px 16px;border-radius:11px;display:none;z-index:90;max-width:90%;text-align:center}@media(max-width:650px){.prefs{grid-template-columns:1fr}.nav{min-height:60px}.hero{padding:30px 0 23px}.panel{padding:14px}.notification{padding:12px}.section-head .btn{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>مركز إشعارات العميل</small></a><a class="back" href="/account.html">← حسابي</a></div></header>
<section class="hero"><div class="wrap hero-row"><div><h1>🔔 الإشعارات</h1><p>تحديثات الشحنات، عروض جديدة، وتغييرات المنصة في مكان واحد.</p></div><div><span>غير المقروء</span> <span id="unreadBadge" class="badge">0</span></div></div></section>
<main class="main"><div class="wrap">
<section class="panel"><div class="section-head"><h2>إشعاراتي</h2><button id="readAllBtn" class="btn soft">تحديد الكل كمقروء</button></div><div class="filters"><button class="filter active" data-type="all">الكل</button><button class="filter" data-type="shipment">🚚 الشحنات</button><button class="filter" data-type="offer">🎁 العروض</button><button class="filter" data-type="system">⚙️ المنصة</button><button class="filter" data-type="support">💬 الدعم</button></div><div id="list"><div class="empty">جاري تحميل الإشعارات…</div></div></section>
<section class="panel"><div class="section-head"><div><h2>إعدادات الإشعارات</h2><small style="color:var(--muted)">اختر ما تريد استلامه.</small></div><button id="savePrefs" class="btn primary">حفظ الإعدادات</button></div><div class="prefs"><label class="pref"><span><b>واتساب</b><small>استلام العروض والتحديثات على واتساب بعد موافقتك</small></span><input id="whatsappEnabled" class="switch" type="checkbox"></label><label class="pref"><span><b>تحديثات الشحنات</b><small>مراحل الشحنة والوصول والتسليم</small></span><input id="shipmentEnabled" class="switch" type="checkbox" checked></label><label class="pref"><span><b>العروض الجديدة</b><small>العروض والخصومات والخدمات الجديدة</small></span><input id="offersEnabled" class="switch" type="checkbox" checked></label><label class="pref"><span><b>تحديثات المنصة</b><small>المزايا والتغييرات المهمة في التطبيق</small></span><input id="systemEnabled" class="switch" type="checkbox" checked></label></div><div id="waStatus" class="status"></div></section>
</div></main><div id="toast" class="toast"></div>
<script>
let data={notifications:[],types:{},preferences:{}},activeType='all';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر إكمال العملية');return d}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2600)}
function fmt(v){if(!v)return'';const d=new Date(String(v).includes('T')?v:String(v).replace(' ','T')+'Z');return Number.isNaN(d.getTime())?v:d.toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'})}
function render(){const rows=data.notifications.filter(n=>activeType==='all'||n.notification_type===activeType);$('unreadBadge').textContent=data.unread||0;$('list').innerHTML=rows.length?rows.map(n=>`<article class="notification ${n.read_at?'':'unread'}"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="meta"><span class="type ${esc(n.notification_type)}">${esc(data.types[n.notification_type]||'إشعار')}</span><span>${esc(fmt(n.created_at))}</span>${n.read_at?'<span>✓ مقروء</span>':'<span>● جديد</span>'}</div><div class="actions">${n.action_url?`<a class="link" href="${esc(n.action_url)}">فتح التفاصيل ←</a>`:''}${!n.read_at?`<button class="read" onclick="markRead('${esc(n.source)}',${Number(n.id)})">تحديد كمقروء</button>`:''}</div></article>`).join(''):'<div class="empty">لا توجد إشعارات في هذا القسم.</div>'}
async function load(){try{data=await api('/api/notification-center/customer');const p=data.preferences||{};$('whatsappEnabled').checked=Number(p.whatsapp_enabled||0)===1;$('offersEnabled').checked=Number(p.offers_enabled??1)===1;$('systemEnabled').checked=Number(p.system_enabled??1)===1;$('shipmentEnabled').checked=Number(p.shipment_enabled??1)===1;$('waStatus').textContent=data.whatsapp_configured?'✅ خدمة واتساب متصلة بالمنصة. إرسال العروض يعتمد على موافقتك أعلاه.':'⚠️ خدمة واتساب تحتاج إعداد بيانات WhatsApp Business من الإدارة.';render()}catch(e){if(/تسجيل الدخول/.test(e.message)){location.href='/account.html';return}toast(e.message);$('list').innerHTML='<div class="empty">تعذر تحميل الإشعارات.</div>'}}
async function markRead(source,id){try{await api(`/api/notification-center/customer/${encodeURIComponent(source)}/${id}/read`,{method:'PATCH'});await load()}catch(e){toast(e.message)}}
$('readAllBtn').addEventListener('click',async()=>{try{await api('/api/notification-center/customer/read-all',{method:'PATCH'});toast('تم تحديد جميع الإشعارات كمقروءة');await load()}catch(e){toast(e.message)}});
$('savePrefs').addEventListener('click',async()=>{try{await api('/api/notification-center/customer/preferences',{method:'PUT',body:JSON.stringify({whatsapp_enabled:$('whatsappEnabled').checked,offers_enabled:$('offersEnabled').checked,system_enabled:$('systemEnabled').checked,shipment_enabled:$('shipmentEnabled').checked})});toast('تم حفظ إعدادات الإشعارات');await load()}catch(e){toast(e.message)}});
document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');activeType=btn.dataset.type;render()}));load();
</script>
</body></html>
