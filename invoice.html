<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفواتير | الرفاعي للشحن الدولي</title><style>
:root{--navy:#071d31;--gold:#c6932e;--bg:#f4f6f8;--line:#e1e6ea;--muted:#6b7680}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#17222d;line-height:1.7}a{text-decoration:none;color:inherit}.wrap{width:min(900px,calc(100% - 24px));margin:auto}.top{background:#071d31;color:#fff;padding:16px 0}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px}.top b{font-size:18px}.top a{color:#e9ce8b;font-weight:900}.main{padding:22px 0 50px}.invoice,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px #071d310d}.head{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:14px}.head h1{margin:0;color:var(--navy);font-size:26px}.muted{color:var(--muted)}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}.meta div{background:#f8fafb;border-radius:10px;padding:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f2;text-align:right}.table th{background:#f7f4ed;color:var(--navy)}.summary{margin-right:auto;width:min(360px,100%);margin-top:16px}.line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #e4e8eb}.grand{font-size:20px;font-weight:900;color:var(--navy)}.btn{display:inline-flex;padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#a8751f);color:#fff;font-weight:900;margin-top:14px}.orders{display:grid;gap:8px;margin-top:12px}.order{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fafcfd}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:600px){.head{display:block}.meta{grid-template-columns:1fr}.invoice,.panel{padding:14px}.table{font-size:12px}.order{display:block}}
</style></head><body><header class="top"><div class="wrap"><b>الرفاعي للشحن الدولي</b><a href="/account.html">العودة إلى حسابي</a></div></header><main class="main"><div class="wrap"><div id="app" class="panel">جارٍ تحميل الفواتير…</div></div></main><script>
const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path){const r=await fetch(path),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}function money(v){return Number(v||0).toLocaleString('ar-SA',{maximumFractionDigits:2})+' ر.س'}
function renderInvoice(i){const m=i.meta||{};app.className='invoice';app.innerHTML=`<div class="head"><div><h1>فاتورة الطلب</h1><div class="muted">${esc(i.invoiceNo)}</div></div><div><b>${esc(i.order.order_no)}</b><br><span class="muted">${esc(i.order.created_at)}</span></div></div><div class="meta"><div><b>العميل</b><br>${esc(i.order.name)}</div><div><b>الجوال</b><br>${esc(i.order.phone)}</div><div><b>المدينة</b><br>${esc(i.order.city)}</div><div><b>العنوان</b><br>${esc(m.delivery_address||'—')}</div></div><div style="overflow:auto"><table class="table"><thead><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.unit_price)}</td><td>${money(x.unit_price*x.qty)}</td></tr>`).join('')}</tbody></table></div><div class="summary"><div class="line"><span>المنتجات</span><b>${money(m.subtotal)}</b></div><div class="line"><span>الشحن</span><b>${money(m.shipping_total)}</b></div>${m.installation_total?`<div class="line"><span>التركيب</span><b>${money(m.installation_total)}</b></div>`:''}${m.service_fee?`<div class="line"><span>رسوم الخدمة</span><b>${money(m.service_fee)}</b></div>`:''}${m.discount_total?`<div class="line"><span>الخصم</span><b>− ${money(m.discount_total)}</b></div>`:''}<div class="line grand"><span>الإجمالي</span><b>${money(m.grand_total)}</b></div></div><a class="btn" href="/tracking.html?order=${encodeURIComponent(i.order.order_no)}">تتبع الطلب</a>`}
async function load(){const order=new URLSearchParams(location.search).get('order');try{if(order){const d=await api('/api/pro/invoice/'+encodeURIComponent(order));return renderInvoice(d.invoice)}const d=await api('/api/my-orders');app.innerHTML='<h1 style="margin:0;color:#071d31">فواتيري</h1><div class="muted">اختر طلبًا لعرض فاتورته التفصيلية.</div><div class="orders">'+(d.orders.length?d.orders.map(o=>`<a class="order" href="/invoice.html?order=${encodeURIComponent(o.order_no)}"><b>${esc(o.order_no)}</b><span>${esc(o.product)}</span><span class="muted">${esc(o.created_at)}</span></a>`).join(''):'<div class="empty">لا توجد طلبات حتى الآن.</div>')+'</div>'}catch(e){app.innerHTML=`<div class="empty">${esc(e.message)}<br><a class="btn" href="/account.html">تسجيل الدخول / حسابي</a></div>`}}load();
</script></body></html>
