<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة الرفاعي</title>
<style>body{font-family:Arial;margin:0;background:#f7f4ed;color:#15202f}header{padding:20px;background:white}main{padding:18px;max-width:1000px;margin:auto}.card{background:white;padding:18px;border-radius:18px;margin:14px 0}.hidden{display:none}input,button,select{padding:13px;border-radius:10px;border:1px solid #ddd;width:100%;margin:5px 0;box-sizing:border-box}button{background:#bd8b29;color:white;border:0;font-weight:bold}table{width:100%;border-collapse:collapse;min-width:700px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}.scroll{overflow:auto}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{background:white;padding:15px;border-radius:14px;flex:1;min-width:120px}.stats b{font-size:26px;color:#bd8b29;display:block}</style></head>
<body><header><h2>الرفاعي للشحن الدولي — لوحة الإدارة</h2></header><main>
<div id="login" class="card"><h3>دخول المدير</h3><input id="phone" placeholder="رقم الجوال"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="doLogin()">دخول</button><p id="msg"></p></div>
<div id="panel" class="hidden"><div class="stats"><div>الطلبات<b id="count">0</b></div><div>تم الشحن<b id="shipped">0</b></div></div>
<div class="card"><input id="q" placeholder="بحث" oninput="render()"><button onclick="load()">تحديث الطلبات</button><div class="scroll"><table><thead><tr><th>الطلب</th><th>العميل</th><th>الجوال</th><th>المنتج</th><th>المدينة</th><th>الحالة</th><th>تحديث</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<button onclick="logout()">تسجيل الخروج</button></div></main>
<script>
let orders=[];async function api(u,o={}){let r=await fetch(u,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...o});let d=await r.json();if(!r.ok)throw Error(d.error||"خطأ");return d}
async function doLogin(){try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({phone:phone.value,password:password.value})});if(!d.user||d.user.role!=="admin")throw Error("الحساب ليس مديراً");show();load()}catch(e){msg.textContent=e.message}}
function show(){login.classList.add("hidden");panel.classList.remove("hidden")}async function load(){try{orders=(await api("/api/admin/orders")).orders||[];render()}catch(e){alert(e.message)}}
function render(){let s=q.value.toLowerCase();let a=orders.filter(o=>!s||JSON.stringify(o).toLowerCase().includes(s));count.textContent=orders.length;shipped.textContent=orders.filter(o=>o.status==="shipped").length;rows.innerHTML=a.map(o=>`<tr><td>${o.order_no||""}</td><td>${o.name||""}</td><td>${o.phone||""}</td><td>${o.product||""}</td><td>${o.city||""}</td><td>${o.status||""}</td><td><select onchange="status(${o.id},this.value)"><option value="">اختر</option><option value="received">تم استلام الطلب</option><option value="confirming">جاري تأكيد السعر والتوفر</option><option value="purchased">تم الشراء والتجهيز</option><option value="shipped">تم الشحن</option></select></td></tr>`).join("")}
async function status(id,s){if(!s)return;try{await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status:s})});load()}catch(e){alert(e.message)}}async function logout(){try{await api("/api/auth/logout",{method:"POST"})}catch(e){}location.reload()}
(async()=>{try{let d=await api("/api/me");if(d.authenticated&&d.user?.role==="admin"){show();load()}}catch(e){}})();
</script></body></html>
