<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة الرفاعي</title>
<style>
body{font-family:Arial;margin:0;background:#f7f4ed;color:#15202f}header{padding:20px;background:white}main{padding:18px;max-width:1000px;margin:auto}.card{background:white;padding:18px;border-radius:18px;margin:14px 0}.hidden{display:none}input,button,select{padding:13px;border-radius:10px;border:1px solid #ddd;width:100%;margin:5px 0;box-sizing:border-box}button{background:#bd8b29;color:white;border:0;font-weight:bold}button:disabled{opacity:.6}.password-wrap{position:relative}.password-wrap input{padding-left:58px}.password-toggle{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:44px;height:38px;margin:0;padding:0;background:transparent;color:#15202f;border:0;font-size:21px;cursor:pointer}.linkbtn{background:transparent;color:#8d671f;border:0;text-decoration:underline;padding:8px;width:auto;cursor:pointer}.recovery{margin-top:12px;padding:14px;border:1px solid #eadcc0;border-radius:12px;background:#fbf8f1}.recovery input{background:#fff}table{width:100%;border-collapse:collapse;min-width:700px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:right}.scroll{overflow:auto}.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{background:white;padding:15px;border-radius:14px;flex:1;min-width:120px}.stats b{font-size:26px;color:#bd8b29;display:block}.msg{min-height:24px;color:#b42318}.ok{color:#18794e}
</style></head><body><header><h2>الرفاعي للشحن الدولي — لوحة الإدارة</h2></header><main>
<div id="login" class="card"><h3>دخول المدير</h3>
<input id="phone" inputmode="tel" placeholder="رقم الجوال">
<div class="password-wrap"><input id="password" type="password" placeholder="كلمة المرور"><button type="button" class="password-toggle" id="passwordToggle" onclick="togglePassword()" aria-label="إظهار كلمة المرور">👁️</button></div>
<button id="loginBtn" onclick="doLogin()">دخول</button>
<button type="button" class="linkbtn" onclick="toggleRecovery()">نسيت كلمة المرور؟ استرداد عبر البريد</button>
<div id="recoveryBox" class="recovery hidden">
  <strong>استرداد دخول المدير</strong>
  <p style="margin:8px 0;font-size:13px">أدخل البريد المرتبط بحساب المدير وسيصلك رابط دخول آمن صالح لمدة 15 دقيقة.</p>
  <input id="recoveryEmail" type="email" autocomplete="email" placeholder="البريد الإلكتروني">
  <button id="recoveryBtn" onclick="requestRecovery()">إرسال رابط الاسترداد</button>
  <p id="recoveryMsg" class="msg"></p>
</div>
<p id="msg" class="msg"></p></div>
<div id="panel" class="hidden"><div class="stats"><div>الطلبات<b id="count">0</b></div><div>تم الشحن<b id="shipped">0</b></div></div>
<div class="card"><input id="q" placeholder="بحث" oninput="render()"><button onclick="load()">تحديث الطلبات</button><div class="scroll"><table><thead><tr><th>الطلب</th><th>العميل</th><th>الجوال</th><th>المنتج</th><th>المدينة</th><th>الحالة</th><th>تحديث</th></tr></thead><tbody id="rows"></tbody></table></div></div><button onclick="logout()">تسجيل الخروج</button></div></main>
<script>
let orders=[];const labels=['تم استلام الطلب','جاري تأكيد السعر والتوفر','تم الشراء والتجهيز','تم الشحن'];
async function api(u,o={}){let r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o});let d={};try{d=await r.json()}catch(_){d={}}if(!r.ok)throw Error(d.error||('خطأ '+r.status));return d}
function togglePassword(){const p=document.getElementById('password'),b=document.getElementById('passwordToggle');const showing=p.type==='text';p.type=showing?'password':'text';b.textContent=showing?'👁️':'🙈';b.setAttribute('aria-label',showing?'إظهار كلمة المرور':'إخفاء كلمة المرور')}
function toggleRecovery(){recoveryBox.classList.toggle('hidden');recoveryMsg.textContent=''}
async function requestRecovery(){recoveryMsg.textContent='';const email=recoveryEmail.value.trim();if(!email){recoveryMsg.textContent='اكتب البريد الإلكتروني';return}recoveryBtn.disabled=true;recoveryBtn.textContent='جاري الإرسال...';try{const d=await api('/api/admin/recovery/request',{method:'POST',body:JSON.stringify({email})});recoveryMsg.className='ok';recoveryMsg.textContent=d.message||'تم إرسال الطلب.'}catch(e){recoveryMsg.className='msg';recoveryMsg.textContent=e.message}finally{recoveryBtn.disabled=false;recoveryBtn.textContent='إرسال رابط الاسترداد'}}
async function doLogin(){msg.textContent='';loginBtn.disabled=true;loginBtn.textContent='جاري الدخول...';try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({phone:phone.value.trim(),password:password.value})});if(!d.user||d.user.role!=='admin')throw Error('الحساب ليس مديراً');show();await load()}catch(e){msg.textContent=e.message}finally{loginBtn.disabled=false;loginBtn.textContent='دخول'}}
function show(){login.classList.add('hidden');panel.classList.remove('hidden')}
async function load(){try{orders=(await api('/api/admin/orders')).orders||[];render()}catch(e){alert(e.message)}}
function render(){let s=q.value.toLowerCase();let a=orders.filter(o=>!s||JSON.stringify(o).toLowerCase().includes(s));count.textContent=orders.length;shipped.textContent=orders.filter(o=>Number(o.status)===3).length;rows.innerHTML=a.map(o=>`<tr><td>${o.order_no||''}</td><td>${o.name||''}</td><td>${o.phone||''}</td><td>${o.product||''}</td><td>${o.city||''}</td><td>${labels[Number(o.status)]||'غير محدد'}</td><td><select onchange="status('${o.order_no}',this.value)"><option value="">اختر</option><option value="0">تم استلام الطلب</option><option value="1">جاري تأكيد السعر والتوفر</option><option value="2">تم الشراء والتجهيز</option><option value="3">تم الشحن</option></select></td></tr>`).join('')}
async function status(orderNo,s){if(s==='')return;try{await api('/api/admin/orders/'+encodeURIComponent(orderNo)+'/status',{method:'PATCH',body:JSON.stringify({status:Number(s)})});await load()}catch(e){alert(e.message)}}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}location.reload()}
(async()=>{try{let d=await api('/api/me');if(d.authenticated&&d.user?.role==='admin'){show();await load();if(new URLSearchParams(location.search).get('recovered')==='1')alert('تم استرداد دخول المدير عبر البريد بنجاح')}}catch(e){}})();
</script></body></html>
