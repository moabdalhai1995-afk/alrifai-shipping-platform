<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css?v=3.9.3"><style>
.category-strip-shell{background:rgba(255,255,255,.98);border:1px solid #e8e2d7;border-radius:16px;box-shadow:0 4px 14px rgba(11,31,51,.06);margin-bottom:12px;overflow:hidden}
.category-strip{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:none;padding:8px 10px;white-space:nowrap;-webkit-overflow-scrolling:touch;min-height:52px;align-items:center}
.category-strip::-webkit-scrollbar{display:none}.category-chip{flex:0 0 auto;border:1px solid #e2ddd4;background:#fff;color:#0b1f33;border-radius:999px;padding:5px 10px 5px 7px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:.18s ease;box-shadow:0 2px 7px rgba(11,31,51,.04);display:inline-flex;align-items:center;gap:7px;min-height:38px}
.category-chip:hover{border-color:#c6922b;transform:translateY(-1px)}.category-chip.active{background:#fff7e7;color:#8c6114;border-color:#c6922b;box-shadow:0 4px 12px rgba(198,146,43,.16)}
.category-thumb{width:28px;height:28px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:0 0 28px;background:#eef4f5;border:1px solid #eee6d8}.category-thumb img{width:100%;height:100%;object-fit:cover;display:block}.category-fallback{font-size:14px;background:linear-gradient(135deg,#eef4f5,#fff7e7)}
.products-toolbar{margin-bottom:20px}.products-toolbar .field{width:100%}.btn.edit-product{background:#fff3d5;color:#6d4d10;border:1px solid #ead39a}.operator-note{display:none;margin:0 0 14px;padding:10px 13px;border-radius:12px;background:#fff8e5;border:1px solid #ecd28f;color:#624812;font-weight:700}
.edit-modal{display:none;position:fixed;inset:0;background:#06111dcc;z-index:90;padding:18px;align-items:center;justify-content:center}.edit-modal.show{display:flex}.edit-box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 24px 80px #0006}.edit-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid #e4e8eb;position:sticky;top:0;background:#fff;z-index:2}.edit-head h2{margin:0;color:#0b1f33;font-size:22px}.edit-close{border:1px solid #dde3e7;background:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:22px}.edit-form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-form label{font-weight:800;color:#263745}.edit-field{width:100%;min-height:46px;padding:10px 12px;border:1px solid #d8dfe4;border-radius:11px;background:#fff;color:#17212b}.edit-field:disabled{background:#f3f5f6;color:#69737b}.edit-wide{grid-column:1/-1}.edit-form textarea{min-height:100px;resize:vertical}.edit-actions{display:flex;gap:8px;grid-column:1/-1}.edit-actions .btn{flex:1}
@media(max-width:700px){.category-strip-shell{margin-inline:-6px;border-radius:12px}.category-strip{padding:7px 8px;gap:7px;min-height:48px}.category-chip{padding:4px 9px 4px 6px;font-size:12px;min-height:36px}.category-thumb{width:26px;height:26px;flex-basis:26px}.hero{padding-top:32px}.edit-modal{padding:0;align-items:stretch}.edit-box{border-radius:0;min-height:100vh;max-height:100vh}.edit-form{grid-template-columns:1fr}.edit-wide,.edit-actions{grid-column:auto}.actions{grid-template-columns:1fr 1fr}.actions .edit-product{grid-column:1/-1}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>تسوق وشحن من السعودية إلى السودان</small></a><nav class="links"><a href="/">الرئيسية</a><a href="/services.html">الخدمات</a><a href="/calculator.html">الحاسبة</a><a href="/how-it-works.html">كيف تعمل</a><a href="/tracking.html">التتبع</a><a href="/cart.html">السلة</a><a href="/account.html">حسابي</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>المنتجات والأقسام</h1><p>اختر القسم من الشريط الأفقي، أو ابحث في المنتجات المتاحة ثم أضف اختيارك إلى السلة.</p></div></section>
<main class="main"><div class="wrap"><div id="operatorNote" class="operator-note"></div><div class="category-strip-shell" aria-label="أقسام المنتجات"><div id="categoryStrip" class="category-strip"><button class="category-chip active" type="button" data-category=""><span class="category-thumb category-fallback" aria-hidden="true">🛍️</span><span>كل الأقسام</span></button></div></div><div class="toolbar products-toolbar"><input id="search" class="field" type="search" placeholder="ابحث باسم المنتج أو الوصف" autocomplete="off"></div><div id="grid" class="grid"><div class="empty">جاري تحميل المنتجات…</div></div></div></main>
<footer><div class="wrap footer-row"><span>© الرفاعي للشحن الدولي</span><a href="https://wa.me/966540407193" target="_blank" rel="noopener">تواصل عبر واتساب</a></div></footer>
<div id="editModal" class="edit-modal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="edit-box"><div class="edit-head"><h2 id="editTitle">تعديل المنتج</h2><button class="edit-close" type="button" onclick="closeEdit()" aria-label="إغلاق">×</button></div><form id="editForm" class="edit-form"><input id="editId" type="hidden"><div><label for="editName">اسم المنتج</label><input id="editName" class="edit-field" required></div><div><label for="editCategory">القسم</label><input id="editCategory" class="edit-field"></div><div><label for="editPrice">السعر الحالي</label><input id="editPrice" class="edit-field" type="number" min="0" step="0.01"></div><div><label for="editOldPrice">السعر قبل الخصم</label><input id="editOldPrice" class="edit-field" type="number" min="0" step="0.01" placeholder="اختياري"></div><div><label for="editStock">الكمية المتوفرة</label><input id="editStock" class="edit-field" type="number" min="0" step="1"></div><div><label for="editImage">رابط الصورة</label><input id="editImage" class="edit-field" type="url" placeholder="https://"></div><div class="edit-wide"><label for="editDescription">الوصف / تعليق المندوب</label><textarea id="editDescription" class="edit-field"></textarea></div><div class="edit-actions"><button id="editSubmit" class="btn primary" type="submit">حفظ التعديلات</button><button class="btn" type="button" onclick="closeEdit()">إلغاء</button></div></form></div></div>
<div id="toast" class="toast"></div>
<script>
const phone="966540407193";
const fallbackProducts=[
{id:"fallback-1",name:"ثلاجات",category:"أجهزة منزلية",icon:"🧊",description:"أجهزة منزلية",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-2",name:"مكيفات",category:"تكييف",icon:"❄️",description:"سبليت وشباك",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-3",name:"أثاث منزلي",category:"أثاث",icon:"🛋️",description:"غرف ومجالس وكنب",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-4",name:"شاشات وأجهزة",category:"إلكترونيات",icon:"📺",description:"إلكترونيات منزلية",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-5",name:"غسالات",category:"أجهزة منزلية",icon:"🧺",description:"غسالات منزلية",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-6",name:"أجهزة مطبخ",category:"أجهزة منزلية",icon:"🍳",description:"أجهزة ومستلزمات المطبخ",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-7",name:"مكاتب وتجهيزات",category:"أثاث",icon:"🪑",description:"مكاتب وتجهيزات تجارية",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-8",name:"إكسسوارات إلكترونية",category:"إلكترونيات",icon:"🔌",description:"ملحقات وأجهزة",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-9",name:"قطع غيار السيارات",category:"قطع غيار السيارات",icon:"⚙️",description:"قطع غيار وصيانة لمختلف أنواع السيارات",price:0,currency:"SAR",stock_quantity:100,image_url:""}
];
let products=[];let activeCategory="";let operatorRole="";let canEditProducts=false;const cart=JSON.parse(localStorage.getItem("rifai_cart")||"[]");
const search=document.getElementById("search"),grid=document.getElementById("grid"),categoryStrip=document.getElementById("categoryStrip");
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.style.display="block";setTimeout(()=>el.style.display="none",2600)}
async function api(path,options={}){const r=await fetch(path,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"حدث خطأ");return d}
function isCarCategory(category){const c=String(category||"");return c.includes("سيار")&&!c.includes("غيار")}
function canEditProduct(p){if(!canEditProducts)return false;if(operatorRole==="admin")return true;return operatorRole==="vehicle_agent"&&isCarCategory(p.category)}
function ask(name){window.open(`https://wa.me/${phone}?text=${encodeURIComponent("السلام عليكم، أريد الاستفسار عن المنتج: "+name)}`,"_blank","noopener")}
function add(id){const item=products.find(p=>String(p.id)===String(id));if(!item||Number(item.stock_quantity)===0)return toast("المنتج غير متوفر حاليًا");cart.push({id:item.id,name:item.name,cat:item.category,desc:item.description,price:item.price?Number(item.price).toLocaleString("ar-SA")+" "+item.currency:"حسب المورد",stock:Number(item.stock_quantity),image:item.image_url||"",icon:item.icon||"📦"});localStorage.setItem("rifai_cart",JSON.stringify(cart));toast("تمت الإضافة إلى السلة")}
function render(){const q=search.value.trim().toLowerCase();const list=products.filter(p=>(!q||String(p.name).toLowerCase().includes(q)||String(p.description||"").toLowerCase().includes(q))&&(!activeCategory||p.category===activeCategory));grid.innerHTML=list.length?list.map(p=>`<article class="card"><div class="visual">${p.image_url?`<img src="${safe(p.image_url)}" alt="${safe(p.name)}" loading="lazy">`:safe(p.icon||"📦")}</div><div class="body"><span class="tag">${safe(p.category||"عام")}</span><h2>${safe(p.name)}</h2><p class="muted">${safe(p.description||"")}</p>${p.old_price&&Number(p.old_price)>Number(p.price)?`<div class="muted"><s>${Number(p.old_price).toLocaleString("ar-SA")} ${safe(p.currency||"SAR")}</s></div>`:""}<div class="price">${p.price?Number(p.price).toLocaleString("ar-SA")+" "+safe(p.currency||"SAR"):"حسب المورد"}</div><div class="actions"><button class="btn primary" onclick='add(${JSON.stringify(String(p.id))})' ${Number(p.stock_quantity)===0?"disabled":""}>${Number(p.stock_quantity)===0?"نفد المخزون":"أضف للسلة"}</button><button class="btn whatsapp" onclick='ask(${JSON.stringify(String(p.name))})'>واتساب</button>${canEditProduct(p)?`<button class="btn edit-product" onclick='openEdit(${JSON.stringify(String(p.id))})'>✏️ تعديل المنتج</button>`:""}</div></div></article>`).join(""):'<div class="empty">لا توجد منتجات مطابقة.</div>'}
function selectCategory(value,button){activeCategory=value;categoryStrip.querySelectorAll(".category-chip").forEach(b=>b.classList.toggle("active",b===button));button.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});render()}
function categoryImage(category){const item=products.find(p=>(!category||String(p.category||"").trim()===category)&&String(p.image_url||"").trim());return item?String(item.image_url):""}
function categoryIcon(category){return products.find(p=>String(p.category||"").trim()===category)?.icon||"📦"}
function categoryThumb(category,label){const image=categoryImage(category);return image?`<span class="category-thumb"><img src="${safe(image)}" alt="" loading="lazy" decoding="async"></span>`:`<span class="category-thumb category-fallback" aria-hidden="true">${category?safe(categoryIcon(category)):"🛍️"}</span>`}
function buildCategories(){const categories=[...new Set(products.map(p=>String(p.category||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));categoryStrip.innerHTML=`<button class="category-chip active" type="button" data-category="">${categoryThumb("","كل الأقسام")}<span>كل الأقسام</span></button>`+categories.map(c=>`<button class="category-chip" type="button" data-category="${safe(c)}">${categoryThumb(c,c)}<span>${safe(c)}</span></button>`).join("");categoryStrip.querySelectorAll(".category-chip").forEach(button=>button.addEventListener("click",()=>selectCategory(button.dataset.category||"",button)))}
function showProducts(list){products=Array.isArray(list)&&list.length?list:fallbackProducts;activeCategory="";buildCategories();render()}
async function checkOperator(){try{const me=await api("/api/me");operatorRole=me.user?.role||"";canEditProducts=!!(me.authenticated&&["admin","vehicle_agent"].includes(operatorRole)&&!me.user?.mustChangePassword);const note=document.getElementById("operatorNote");if(canEditProducts){note.style.display="block";note.textContent=operatorRole==="admin"?"وضع الإدارة مفعل: يمكنك تعديل جميع المنتجات مباشرة من البطاقات.":"وضع المندوب مفعل: يمكنك تعديل منتجات السيارات المصرح بها مباشرة من البطاقات."}}catch(e){operatorRole="";canEditProducts=false}}
function openEdit(id){const p=products.find(x=>String(x.id)===String(id));if(!p||!canEditProduct(p))return toast("لا توجد صلاحية لتعديل هذا المنتج");document.getElementById("editId").value=p.id;document.getElementById("editName").value=p.name||"";document.getElementById("editCategory").value=p.category||"";document.getElementById("editCategory").disabled=operatorRole==="vehicle_agent";document.getElementById("editPrice").value=p.price||0;document.getElementById("editOldPrice").value=p.old_price||"";document.getElementById("editStock").value=p.stock_quantity??0;document.getElementById("editImage").value=p.image_url||"";document.getElementById("editDescription").value=p.description||"";document.getElementById("editTitle").textContent="تعديل: "+(p.name||"المنتج");document.getElementById("editModal").classList.add("show");document.body.style.overflow="hidden"}
function closeEdit(){document.getElementById("editModal").classList.remove("show");document.body.style.overflow="";document.getElementById("editForm").reset();document.getElementById("editCategory").disabled=false}
document.getElementById("editForm").addEventListener("submit",async e=>{e.preventDefault();const id=document.getElementById("editId").value,p=products.find(x=>String(x.id)===String(id));if(!p||!canEditProduct(p))return toast("لا توجد صلاحية للتعديل");const payload={name:document.getElementById("editName").value.trim(),price:Math.max(0,Number(document.getElementById("editPrice").value)||0),old_price:document.getElementById("editOldPrice").value===""?null:Math.max(0,Number(document.getElementById("editOldPrice").value)||0),stock_quantity:Math.max(0,Number(document.getElementById("editStock").value)||0),image_url:document.getElementById("editImage").value.trim(),description:document.getElementById("editDescription").value.trim()};if(operatorRole==="admin")payload.category=document.getElementById("editCategory").value.trim();const endpoint=operatorRole==="vehicle_agent"?"/api/vehicle-agent/products/"+encodeURIComponent(id):"/api/admin/products/"+encodeURIComponent(id);const button=document.getElementById("editSubmit");button.disabled=true;try{await api(endpoint,{method:"PATCH",body:JSON.stringify(payload)});toast("تم حفظ تعديل المنتج");closeEdit();await load()}catch(err){toast(err.message)}finally{button.disabled=false}});
document.getElementById("editModal").addEventListener("click",e=>{if(e.target.id==="editModal")closeEdit()});
async function load(){try{const r=await fetch("/api/catalog",{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر التحميل");showProducts(d.products)}catch(e){showProducts(fallbackProducts)}}
async function boot(){await checkOperator();await load()}
search.addEventListener("input",render);boot();
</script></body></html>
