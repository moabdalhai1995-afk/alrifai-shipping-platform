<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css"></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>تسوق وشحن من السعودية إلى السودان</small></a><nav class="links"><a href="/">الرئيسية</a><a href="/products.html">المنتجات</a><a href="/tracking.html">تتبع الطلب</a><a href="/partners.html">الشركاء</a><a href="/#accountArea">حسابي</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>المنتجات والأقسام</h1><p>ابحث في المنتجات المتاحة، ثم أضف اختيارك إلى السلة أو استفسر عنه مباشرة عبر واتساب.</p></div></section>
<main class="main"><div class="wrap"><div class="toolbar"><input id="search" class="field" type="search" placeholder="ابحث باسم المنتج أو الوصف"><select id="category" class="field"><option value="">كل الأقسام</option></select></div><div id="grid" class="grid"><div class="empty">جاري تحميل المنتجات…</div></div></div></main>
<footer><div class="wrap footer-row"><span>© الرفاعي للشحن الدولي</span><a href="https://wa.me/966540407193" target="_blank" rel="noopener">تواصل عبر واتساب</a></div></footer><div id="toast" class="toast"></div>
<script>
const phone="966540407193";let products=[];const cart=JSON.parse(localStorage.getItem("rifai_cart")||"[]");
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.style.display="block";setTimeout(()=>el.style.display="none",2600)}
function ask(name){window.open(`https://wa.me/${phone}?text=${encodeURIComponent("السلام عليكم، أريد الاستفسار عن المنتج: "+name)}`,"_blank","noopener")}
function add(id){const item=products.find(p=>Number(p.id)===Number(id));if(!item||Number(item.stock_quantity)===0)return toast("المنتج غير متوفر حاليًا");cart.push({id:item.id,name:item.name,cat:item.category,desc:item.description,price:item.price?Number(item.price).toLocaleString("ar-SA")+" "+item.currency:"حسب المورد",stock:Number(item.stock_quantity),image:item.image_url||"",icon:"📦"});localStorage.setItem("rifai_cart",JSON.stringify(cart));toast("تمت الإضافة إلى السلة ويمكنك إكمال الطلب من الرئيسية")}
function render(){const q=search.value.trim().toLowerCase(),cat=category.value;const list=products.filter(p=>(!q||String(p.name).toLowerCase().includes(q)||String(p.description||"").toLowerCase().includes(q))&&(!cat||p.category===cat));grid.innerHTML=list.length?list.map(p=>`<article class="card"><div class="visual">${p.image_url?`<img src="${safe(p.image_url)}" alt="${safe(p.name)}" loading="lazy">`:"📦"}</div><div class="body"><span class="tag">${safe(p.category||"عام")}</span><h2>${safe(p.name)}</h2><p class="muted">${safe(p.description||"")}</p><div class="price">${p.price?Number(p.price).toLocaleString("ar-SA")+" "+safe(p.currency||"SAR"):"حسب المورد"}</div><div class="actions"><button class="btn primary" onclick="add(${Number(p.id)})" ${Number(p.stock_quantity)===0?"disabled":""}>${Number(p.stock_quantity)===0?"نفد المخزون":"أضف للسلة"}</button><button class="btn whatsapp" onclick='ask(${JSON.stringify(String(p.name))})'>واتساب</button></div></div></article>`).join(""):'<div class="empty">لا توجد منتجات مطابقة.</div>'}
async function load(){try{const r=await fetch("/api/catalog"),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر التحميل");products=d.products||[];[...new Set(products.map(p=>p.category).filter(Boolean))].forEach(c=>category.insertAdjacentHTML("beforeend",`<option value="${safe(c)}">${safe(c)}</option>`));render()}catch(e){grid.innerHTML=`<div class="empty">${safe(e.message)}</div>`}}
search.addEventListener("input",render);category.addEventListener("change",render);load();
</script></body></html>
