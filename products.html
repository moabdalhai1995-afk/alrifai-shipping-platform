<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css"><style>
.category-strip-shell{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.98);border-bottom:1px solid #e8e2d7;box-shadow:0 6px 18px rgba(11,31,51,.08);backdrop-filter:blur(10px)}
.category-strip{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:none;padding:12px 2px;white-space:nowrap;-webkit-overflow-scrolling:touch}
.category-strip::-webkit-scrollbar{display:none}.category-chip{flex:0 0 auto;border:1px solid #ded7ca;background:#fff;color:#0b1f33;border-radius:999px;padding:10px 17px;font:inherit;font-weight:800;cursor:pointer;transition:.18s ease;box-shadow:0 2px 8px rgba(11,31,51,.04)}
.category-chip:hover{border-color:#c6922b}.category-chip.active{background:#c6922b;color:#fff;border-color:#c6922b;box-shadow:0 5px 14px rgba(198,146,43,.25)}
.products-toolbar{margin-bottom:20px}.products-toolbar .field{width:100%}
@media(max-width:700px){.category-strip-shell{top:0}.category-strip{padding:10px 2px}.category-chip{padding:9px 14px;font-size:15px}.hero{padding-top:32px}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>تسوق وشحن من السعودية إلى السودان</small></a><nav class="links"><a href="/">الرئيسية</a><a href="/services.html">الخدمات</a><a href="/calculator.html">الحاسبة</a><a href="/how-it-works.html">كيف تعمل</a><a href="/tracking.html">التتبع</a><a href="/cart.html">السلة</a><a href="/account.html">حسابي</a></nav></div></header>
<div class="category-strip-shell" aria-label="أقسام المنتجات"><div class="wrap"><div id="categoryStrip" class="category-strip"><button class="category-chip active" type="button" data-category="">كل الأقسام</button></div></div></div>
<section class="hero"><div class="wrap"><h1>المنتجات والأقسام</h1><p>اختر القسم من الشريط أعلى الشاشة، أو ابحث في المنتجات المتاحة ثم أضف اختيارك إلى السلة.</p></div></section>
<main class="main"><div class="wrap"><div class="toolbar products-toolbar"><input id="search" class="field" type="search" placeholder="ابحث باسم المنتج أو الوصف" autocomplete="off"></div><div id="grid" class="grid"><div class="empty">جاري تحميل المنتجات…</div></div></div></main>
<footer><div class="wrap footer-row"><span>© الرفاعي للشحن الدولي</span><a href="https://wa.me/966540407193" target="_blank" rel="noopener">تواصل عبر واتساب</a></div></footer><div id="toast" class="toast"></div>
<script>
const phone="966540407193";let products=[];let activeCategory="";const cart=JSON.parse(localStorage.getItem("rifai_cart")||"[]");
const search=document.getElementById("search"),grid=document.getElementById("grid"),categoryStrip=document.getElementById("categoryStrip");
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.style.display="block";setTimeout(()=>el.style.display="none",2600)}
function ask(name){window.open(`https://wa.me/${phone}?text=${encodeURIComponent("السلام عليكم، أريد الاستفسار عن المنتج: "+name)}`,"_blank","noopener")}
function add(id){const item=products.find(p=>Number(p.id)===Number(id));if(!item||Number(item.stock_quantity)===0)return toast("المنتج غير متوفر حاليًا");cart.push({id:item.id,name:item.name,cat:item.category,desc:item.description,price:item.price?Number(item.price).toLocaleString("ar-SA")+" "+item.currency:"حسب المورد",stock:Number(item.stock_quantity),image:item.image_url||"",icon:"📦"});localStorage.setItem("rifai_cart",JSON.stringify(cart));toast("تمت الإضافة إلى السلة")}
function render(){const q=search.value.trim().toLowerCase();const list=products.filter(p=>(!q||String(p.name).toLowerCase().includes(q)||String(p.description||"").toLowerCase().includes(q))&&(!activeCategory||p.category===activeCategory));grid.innerHTML=list.length?list.map(p=>`<article class="card"><div class="visual">${p.image_url?`<img src="${safe(p.image_url)}" alt="${safe(p.name)}" loading="lazy">`:"📦"}</div><div class="body"><span class="tag">${safe(p.category||"عام")}</span><h2>${safe(p.name)}</h2><p class="muted">${safe(p.description||"")}</p><div class="price">${p.price?Number(p.price).toLocaleString("ar-SA")+" "+safe(p.currency||"SAR"):"حسب المورد"}</div><div class="actions"><button class="btn primary" onclick="add(${Number(p.id)})" ${Number(p.stock_quantity)===0?"disabled":""}>${Number(p.stock_quantity)===0?"نفد المخزون":"أضف للسلة"}</button><button class="btn whatsapp" onclick='ask(${JSON.stringify(String(p.name))})'>واتساب</button></div></div></article>`).join(""):'<div class="empty">لا توجد منتجات مطابقة.</div>'}
function selectCategory(value,button){activeCategory=value;categoryStrip.querySelectorAll(".category-chip").forEach(b=>b.classList.toggle("active",b===button));button.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});render()}
function buildCategories(){const categories=[...new Set(products.map(p=>String(p.category||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));categoryStrip.innerHTML='<button class="category-chip active" type="button" data-category="">كل الأقسام</button>'+categories.map(c=>`<button class="category-chip" type="button" data-category="${safe(c)}">${safe(c)}</button>`).join("");categoryStrip.querySelectorAll(".category-chip").forEach(button=>button.addEventListener("click",()=>selectCategory(button.dataset.category||"",button)))}
async function load(){try{const r=await fetch("/api/catalog"),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر التحميل");products=d.products||[];buildCategories();render()}catch(e){grid.innerHTML=`<div class="empty">${safe(e.message)}</div>`}}
search.addEventListener("input",render);load();
</script></body></html>
