<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتجات | الرفاعي للشحن الدولي</title><link rel="stylesheet" href="/public-sections.css?v=3.9.2"><style>
.category-strip-shell{background:rgba(255,255,255,.98);border:1px solid #e8e2d7;border-radius:16px;box-shadow:0 4px 14px rgba(11,31,51,.06);margin-bottom:12px;overflow:hidden}
.category-strip{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:none;padding:8px 10px;white-space:nowrap;-webkit-overflow-scrolling:touch;min-height:52px;align-items:center}
.category-strip::-webkit-scrollbar{display:none}.category-chip{flex:0 0 auto;border:1px solid #e2ddd4;background:#fff;color:#0b1f33;border-radius:999px;padding:5px 10px 5px 7px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;transition:.18s ease;box-shadow:0 2px 7px rgba(11,31,51,.04);display:inline-flex;align-items:center;gap:7px;min-height:38px}
.category-chip:hover{border-color:#c6922b;transform:translateY(-1px)}.category-chip.active{background:#fff7e7;color:#8c6114;border-color:#c6922b;box-shadow:0 4px 12px rgba(198,146,43,.16)}
.category-thumb{width:28px;height:28px;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:0 0 28px;background:#eef4f5;border:1px solid #eee6d8}.category-thumb img{width:100%;height:100%;object-fit:cover;display:block}.category-fallback{font-size:14px;background:linear-gradient(135deg,#eef4f5,#fff7e7)}
.products-toolbar{margin-bottom:20px}.products-toolbar .field{width:100%}
@media(max-width:700px){.category-strip-shell{margin-inline:-6px;border-radius:12px}.category-strip{padding:7px 8px;gap:7px;min-height:48px}.category-chip{padding:4px 9px 4px 6px;font-size:12px;min-height:36px}.category-thumb{width:26px;height:26px;flex-basis:26px}.hero{padding-top:32px}}
</style></head><body>
<header class="top"><div class="wrap nav"><a class="brand" href="/"><span>الرفاعي للشحن الدولي</span><small>تسوق وشحن من السعودية إلى السودان</small></a><nav class="links"><a href="/">الرئيسية</a><a href="/services.html">الخدمات</a><a href="/calculator.html">الحاسبة</a><a href="/how-it-works.html">كيف تعمل</a><a href="/tracking.html">التتبع</a><a href="/cart.html">السلة</a><a href="/account.html">حسابي</a></nav></div></header>
<section class="hero"><div class="wrap"><h1>المنتجات والأقسام</h1><p>اختر القسم من الشريط الأفقي، أو ابحث في المنتجات المتاحة ثم أضف اختيارك إلى السلة.</p></div></section>
<main class="main"><div class="wrap"><div class="category-strip-shell" aria-label="أقسام المنتجات"><div id="categoryStrip" class="category-strip"><button class="category-chip active" type="button" data-category=""><span class="category-thumb category-fallback" aria-hidden="true">🛍️</span><span>كل الأقسام</span></button></div></div><div class="toolbar products-toolbar"><input id="search" class="field" type="search" placeholder="ابحث باسم المنتج أو الوصف" autocomplete="off"></div><div id="grid" class="grid"><div class="empty">جاري تحميل المنتجات…</div></div></div></main>
<footer><div class="wrap footer-row"><span>© الرفاعي للشحن الدولي</span><a href="https://wa.me/966540407193" target="_blank" rel="noopener">تواصل عبر واتساب</a></div></footer><div id="toast" class="toast"></div>
<script>
const phone="966540407193";
const fallbackProducts=[
{id:"fallback-1",name:"ثلاجات",category:"أجهزة منزلية",icon:"🧊",description:"أجهزة منزلية",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-2",name:"مكيفات",category:"تكييف",icon:"❄️",description:"سبليت وشباك",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-3",name:"أثاث منزلي",category:"أثاث",icon:"🛋️",description:"غرف ومجالس وكنب",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-4",name:"شاشات وأجهزة",category:"إلكترونيات",icon:"📺",description:"إلكترونيات منزلية",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-5",name:"غسالات",category:"أجهزة منزلية",icon:"🧺",description:"غسالات منزلية",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-6",name:"أجهزة مطبخ",category:"أجهزة منزلية",icon:"🍳",description:"أجهزة ومستلزمات المطبخ",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-7",name:"مكاتب وتجهيزات",category:"أثاث",icon:"🪑",description:"مكاتب وتجهيزات تجارية",price:0,currency:"SAR",stock_quantity:100,image_url:""},
{id:"fallback-8",name:"إكسسوارات إلكترونية",category:"إلكترونيات",icon:"🔌",description:"ملحقات وأجهزة",price:0,currency:"SAR",stock_quantity:100,image_url:""}
];
let products=[];let activeCategory="";const cart=JSON.parse(localStorage.getItem("rifai_cart")||"[]");
const search=document.getElementById("search"),grid=document.getElementById("grid"),categoryStrip=document.getElementById("categoryStrip");
function safe(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.style.display="block";setTimeout(()=>el.style.display="none",2600)}
function ask(name){window.open(`https://wa.me/${phone}?text=${encodeURIComponent("السلام عليكم، أريد الاستفسار عن المنتج: "+name)}`,"_blank","noopener")}
function add(id){const item=products.find(p=>String(p.id)===String(id));if(!item||Number(item.stock_quantity)===0)return toast("المنتج غير متوفر حاليًا");cart.push({id:item.id,name:item.name,cat:item.category,desc:item.description,price:item.price?Number(item.price).toLocaleString("ar-SA")+" "+item.currency:"حسب المورد",stock:Number(item.stock_quantity),image:item.image_url||"",icon:item.icon||"📦"});localStorage.setItem("rifai_cart",JSON.stringify(cart));toast("تمت الإضافة إلى السلة")}
function render(){const q=search.value.trim().toLowerCase();const list=products.filter(p=>(!q||String(p.name).toLowerCase().includes(q)||String(p.description||"").toLowerCase().includes(q))&&(!activeCategory||p.category===activeCategory));grid.innerHTML=list.length?list.map(p=>`<article class="card"><div class="visual">${p.image_url?`<img src="${safe(p.image_url)}" alt="${safe(p.name)}" loading="lazy">`:safe(p.icon||"📦")}</div><div class="body"><span class="tag">${safe(p.category||"عام")}</span><h2>${safe(p.name)}</h2><p class="muted">${safe(p.description||"")}</p><div class="price">${p.price?Number(p.price).toLocaleString("ar-SA")+" "+safe(p.currency||"SAR"):"حسب المورد"}</div><div class="actions"><button class="btn primary" onclick='add(${JSON.stringify(String(p.id))})' ${Number(p.stock_quantity)===0?"disabled":""}>${Number(p.stock_quantity)===0?"نفد المخزون":"أضف للسلة"}</button><button class="btn whatsapp" onclick='ask(${JSON.stringify(String(p.name))})'>واتساب</button></div></div></article>`).join(""):'<div class="empty">لا توجد منتجات مطابقة.</div>'}
function selectCategory(value,button){activeCategory=value;categoryStrip.querySelectorAll(".category-chip").forEach(b=>b.classList.toggle("active",b===button));button.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});render()}
function categoryImage(category){const item=products.find(p=>(!category||String(p.category||"").trim()===category)&&String(p.image_url||"").trim());return item?String(item.image_url):""}
function categoryIcon(category){return products.find(p=>String(p.category||"").trim()===category)?.icon||"📦"}
function categoryThumb(category,label){const image=categoryImage(category);return image?`<span class="category-thumb"><img src="${safe(image)}" alt="" loading="lazy" decoding="async"></span>`:`<span class="category-thumb category-fallback" aria-hidden="true">${category?safe(categoryIcon(category)):"🛍️"}</span>`}
function buildCategories(){const categories=[...new Set(products.map(p=>String(p.category||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));categoryStrip.innerHTML=`<button class="category-chip active" type="button" data-category="">${categoryThumb("","كل الأقسام")}<span>كل الأقسام</span></button>`+categories.map(c=>`<button class="category-chip" type="button" data-category="${safe(c)}">${categoryThumb(c,c)}<span>${safe(c)}</span></button>`).join("");categoryStrip.querySelectorAll(".category-chip").forEach(button=>button.addEventListener("click",()=>selectCategory(button.dataset.category||"",button)))}
function showProducts(list){products=Array.isArray(list)&&list.length?list:fallbackProducts;activeCategory="";buildCategories();render()}
async function load(){try{const r=await fetch("/api/catalog",{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"تعذر التحميل");showProducts(d.products)}catch(e){showProducts(fallbackProducts)}}
search.addEventListener("input",render);load();
</script></body></html>
